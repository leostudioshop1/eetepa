<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AnyMap — Gerenciador de Computadores</title>

  <!-- Config primeiro (mesmo padrão das outras páginas) -->
  <script src="./config.js"></script>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] }
        }
      }
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    * { -webkit-tap-highlight-color: transparent; }
    body { font-family: 'Inter', system-ui, sans-serif; }
    .toast { animation: slideIn 0.3s ease; }
    @keyframes slideIn {
      from { transform: translateY(100%); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    @media (min-width: 640px) {
      .toast { animation-name: slideInRight; }
      @keyframes slideInRight {
        from { transform: translateX(100%); opacity: 0; }
        to { transform: translateX(0); opacity: 1; }
      }
    }
    .status-ativo { background: #dcfce7; color: #166534; }
    .status-inativo { background: #fee2e2; color: #991b1b; }
    .status-manutencao { background: #fef3c7; color: #92400e; }
    .scroll-thin::-webkit-scrollbar { height: 4px; width: 4px; }
    .scroll-thin::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    .card-item { transition: background 0.15s; }
    .card-item:active { background: #f1f5f9; }
    .loading-overlay {
      position: absolute; inset: 0; background: rgba(255,255,255,0.7);
      display: flex; align-items: center; justify-content: center; z-index: 10;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen pb-20 sm:pb-6">

  <div id="config-banner" class="hidden bg-red-600 text-white text-center text-sm py-2 px-4">
    Não foi possível ler as credenciais do Supabase no <strong>config.js</strong>. Verifique o formato do arquivo.
  </div>

  <header class="bg-slate-900 text-white sticky top-0 z-40 shadow-lg">
    <div class="max-w-7xl mx-auto px-3 sm:px-4 py-3 sm:py-4">
      <div class="flex items-center justify-between gap-2">
        <div class="flex items-center gap-2.5 min-w-0">
          <div class="bg-blue-500 p-1.5 sm:p-2 rounded-lg shrink-0">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 sm:h-6 sm:w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
            </svg>
          </div>
          <div class="min-w-0">
            <h1 class="text-base sm:text-xl font-bold truncate">AnyMap</h1>
            <p class="text-slate-400 text-[11px] sm:text-sm hidden sm:block">Gerenciador de Computadores</p>
          </div>
        </div>
        <div class="flex items-center gap-1.5 sm:gap-2 shrink-0">
          <span class="hidden sm:inline px-2.5 py-1 rounded-full bg-emerald-500/20 text-emerald-300 text-[11px] font-medium">Supabase</span>
          <button type="button" onclick="reloadAll()" class="px-2.5 py-1.5 bg-slate-700 hover:bg-slate-600 active:bg-slate-500 rounded-lg text-[11px] sm:text-xs font-medium transition" title="Recarregar dados">↻</button>
        </div>
      </div>
    </div>
  </header>

  <nav class="bg-white border-b border-slate-200 sticky top-[52px] sm:top-[68px] z-30 shadow-sm">
    <div class="max-w-7xl mx-auto px-2 sm:px-4">
      <div class="flex gap-1 overflow-x-auto scroll-thin py-2 -mx-1 px-1" style="scrollbar-width: none;">
        <button type="button" onclick="switchTab('computadores')" id="tab-computadores" class="tab-btn px-3 sm:px-4 py-2 rounded-lg text-xs sm:text-sm font-medium bg-blue-600 text-white whitespace-nowrap shrink-0">Computadores</button>
        <button type="button" onclick="switchTab('orgaos')" id="tab-orgaos" class="tab-btn px-3 sm:px-4 py-2 rounded-lg text-xs sm:text-sm font-medium text-slate-600 hover:bg-slate-100 whitespace-nowrap shrink-0">Órgãos</button>
        <button type="button" onclick="switchTab('departamentos')" id="tab-departamentos" class="tab-btn px-3 sm:px-4 py-2 rounded-lg text-xs sm:text-sm font-medium text-slate-600 hover:bg-slate-100 whitespace-nowrap shrink-0">Departamentos</button>
        <button type="button" onclick="switchTab('salas')" id="tab-salas" class="tab-btn px-3 sm:px-4 py-2 rounded-lg text-xs sm:text-sm font-medium text-slate-600 hover:bg-slate-100 whitespace-nowrap shrink-0">Salas</button>
        <button type="button" onclick="switchTab('responsaveis')" id="tab-responsaveis" class="tab-btn px-3 sm:px-4 py-2 rounded-lg text-xs sm:text-sm font-medium text-slate-600 hover:bg-slate-100 whitespace-nowrap shrink-0">Responsáveis</button>
      </div>
    </div>
  </nav>

  <main class="max-w-7xl mx-auto px-3 sm:px-4 py-4 sm:py-6">

    <div id="stats-section" class="grid grid-cols-2 sm:grid-cols-4 gap-2 sm:gap-4 mb-4 sm:mb-6">
      <div class="bg-white rounded-xl p-3 sm:p-4 shadow-sm border border-slate-200">
        <p class="text-slate-500 text-[11px] sm:text-sm">Total</p>
        <p class="text-xl sm:text-2xl font-bold text-slate-800" id="stat-total">0</p>
      </div>
      <div class="bg-white rounded-xl p-3 sm:p-4 shadow-sm border border-slate-200">
        <p class="text-slate-500 text-[11px] sm:text-sm">Ativos</p>
        <p class="text-xl sm:text-2xl font-bold text-green-600" id="stat-ativos">0</p>
      </div>
      <div class="bg-white rounded-xl p-3 sm:p-4 shadow-sm border border-slate-200">
        <p class="text-slate-500 text-[11px] sm:text-sm">Inativos</p>
        <p class="text-xl sm:text-2xl font-bold text-red-600" id="stat-inativos">0</p>
      </div>
      <div class="bg-white rounded-xl p-3 sm:p-4 shadow-sm border border-slate-200">
        <p class="text-slate-500 text-[11px] sm:text-sm">Manutenção</p>
        <p class="text-xl sm:text-2xl font-bold text-amber-600" id="stat-manutencao">0</p>
      </div>
    </div>

    <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-3 sm:p-4 mb-4 sm:mb-6">
      <div class="flex flex-col gap-2.5 sm:gap-3">
        <div class="relative">
          <input type="text" id="search-input" placeholder="Buscar..." class="w-full pl-9 pr-3 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none text-sm" oninput="handleSearch()" />
          <svg class="absolute left-3 top-3 h-4 w-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
        </div>
        <div class="flex flex-col sm:flex-row gap-2">
          <select id="filter-status" class="flex-1 border border-slate-300 rounded-lg px-3 py-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none" onchange="handleSearch()">
            <option value="">Todos os status</option>
            <option value="Ativo">Ativo</option>
            <option value="Inativo">Inativo</option>
            <option value="Em manutenção">Em manutenção</option>
          </select>
          <div class="flex gap-2">
            <button type="button" onclick="exportCSV()" id="btn-export" class="flex-1 sm:flex-none px-3 sm:px-4 py-2.5 bg-slate-100 hover:bg-slate-200 active:bg-slate-300 text-slate-700 rounded-lg text-sm font-medium transition flex items-center justify-center gap-1.5">
              <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
              <span>CSV</span>
            </button>
            <button type="button" onclick="openModal()" class="flex-1 sm:flex-none px-3 sm:px-4 py-2.5 bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white rounded-lg text-sm font-medium transition flex items-center justify-center gap-1.5">
              <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
              <span>Novo</span>
            </button>
          </div>
        </div>
      </div>
    </div>

    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden relative" id="list-container">
      <div id="loading" class="loading-overlay hidden">
        <div class="flex flex-col items-center gap-2">
          <div class="w-8 h-8 border-4 border-blue-500 border-t-transparent rounded-full animate-spin"></div>
          <span class="text-sm text-slate-500">Carregando...</span>
        </div>
      </div>

      <div class="hidden md:block overflow-x-auto">
        <table class="w-full text-sm">
          <thead class="bg-slate-50 border-b border-slate-200">
            <tr id="table-header"></tr>
          </thead>
          <tbody id="table-body" class="divide-y divide-slate-100"></tbody>
        </table>
      </div>

      <div id="cards-body" class="md:hidden divide-y divide-slate-100"></div>

      <div class="px-3 sm:px-4 py-3 border-t border-slate-200 flex items-center justify-between text-xs sm:text-sm text-slate-500">
        <span id="pagination-info">0 registros</span>
        <div class="flex gap-2">
          <button type="button" onclick="changePage(-1)" id="btn-prev" class="px-3 py-1.5 rounded-lg border border-slate-300 hover:bg-slate-50 active:bg-slate-100 disabled:opacity-40 text-xs sm:text-sm" disabled>Anterior</button>
          <button type="button" onclick="changePage(1)" id="btn-next" class="px-3 py-1.5 rounded-lg border border-slate-300 hover:bg-slate-50 active:bg-slate-100 disabled:opacity-40 text-xs sm:text-sm" disabled>Próximo</button>
        </div>
      </div>
    </div>
  </main>

  <button type="button" onclick="openModal()" class="md:hidden fixed bottom-5 right-5 z-30 w-14 h-14 bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white rounded-full shadow-lg flex items-center justify-center transition">
    <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
  </button>

  <div id="modal" class="fixed inset-0 z-50 hidden">
    <div class="absolute inset-0 bg-black/50" onclick="closeModal()"></div>
    <div class="absolute inset-0 flex items-end sm:items-center justify-center sm:p-4">
      <div class="bg-white rounded-t-2xl sm:rounded-2xl shadow-2xl w-full sm:max-w-lg max-h-[92vh] sm:max-h-[90vh] overflow-y-auto relative">
        <div class="sm:hidden flex justify-center pt-2 pb-1">
          <div class="w-10 h-1 bg-slate-300 rounded-full"></div>
        </div>
        <div class="sticky top-0 bg-white border-b border-slate-200 px-4 sm:px-6 py-3 sm:py-4 flex items-center justify-between sm:rounded-t-2xl z-10">
          <h2 id="modal-title" class="text-base sm:text-lg font-semibold">Novo</h2>
          <button type="button" onclick="closeModal()" class="text-slate-400 hover:text-slate-600 p-1.5 -mr-1.5 rounded-lg hover:bg-slate-100">
            <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
          </button>
        </div>
        <form id="modal-form" class="p-4 sm:p-6 space-y-3.5 sm:space-y-4" onsubmit="saveItem(event)">
          <div id="form-fields"></div>
          <div class="flex gap-2.5 sm:gap-3 pt-1 pb-2 sm:pb-0">
            <button type="button" onclick="closeModal()" class="flex-1 px-4 py-3 sm:py-2.5 border border-slate-300 rounded-xl sm:rounded-lg text-sm font-medium hover:bg-slate-50 active:bg-slate-100 transition">Cancelar</button>
            <button type="submit" id="btn-save" class="flex-1 px-4 py-3 sm:py-2.5 bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white rounded-xl sm:rounded-lg text-sm font-medium transition">Salvar</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <div id="toast-container" class="fixed bottom-20 sm:bottom-4 left-3 right-3 sm:left-auto sm:right-4 z-50 space-y-2 sm:max-w-sm"></div>

  <script>
    // =====================================================
    // LEITURA FLEXÍVEL DO CONFIG.JS
    // Aceita vários formatos comuns usados por outras páginas
    // =====================================================
    function resolveSupabaseCredentials() {
      // 1) window.SUPABASE_URL / window.SUPABASE_ANON_KEY
      var url = window.SUPABASE_URL || window.supabaseUrl || window.SUPABASE_URL;
      var key = window.SUPABASE_ANON_KEY || window.supabaseAnonKey || window.SUPABASE_KEY || window.SUPABASE_ANON_KEY;

      // 2) objeto config / supabaseConfig
      if ((!url || !key) && window.config) {
        url = url || window.config.SUPABASE_URL || window.config.supabaseUrl || window.config.url;
        key = key || window.config.SUPABASE_ANON_KEY || window.config.supabaseAnonKey || window.config.anonKey || window.config.key;
      }
      if ((!url || !key) && window.supabaseConfig) {
        url = url || window.supabaseConfig.url || window.supabaseConfig.SUPABASE_URL;
        key = key || window.supabaseConfig.anonKey || window.supabaseConfig.SUPABASE_ANON_KEY;
      }

      // 3) variáveis soltas (sem window) — alguns configs fazem const e depois expõem
      try {
        if (typeof SUPABASE_URL !== 'undefined') url = url || SUPABASE_URL;
        if (typeof SUPABASE_ANON_KEY !== 'undefined') key = key || SUPABASE_ANON_KEY;
      } catch (e) {}

      return { url: url, key: key };
    }

    var supabaseClient = null;
    var currentTab = 'computadores';
    var currentPage = 0;
    var PAGE_SIZE = 12;
    var editingId = null;
    var filteredData = [];
    var cache = { orgaos: [], departamentos: [], salas: [], responsaveis: [], computadores: [] };

    function esc(str) {
      if (str == null) return '';
      return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function showToast(msg, type) {
      type = type || 'success';
      var container = document.getElementById('toast-container');
      if (!container) return;
      var toast = document.createElement('div');
      var bg = type === 'success' ? 'bg-green-600' : 'bg-red-600';
      toast.className = 'toast ' + bg + ' text-white px-4 py-3 rounded-xl shadow-lg text-sm font-medium flex items-center gap-2';
      toast.innerHTML = '<span>' + (type === 'success' ? '✓' : '✕') + '</span><span>' + msg + '</span>';
      container.appendChild(toast);
      setTimeout(function() {
        toast.style.opacity = '0';
        toast.style.transition = 'opacity 0.3s';
        setTimeout(function() { if (toast.parentNode) toast.remove(); }, 300);
      }, 3000);
    }

    function setLoading(on) {
      var el = document.getElementById('loading');
      if (el) el.classList.toggle('hidden', !on);
    }

    function hasConfig() {
      var c = resolveSupabaseCredentials();
      return !!(c.url && c.key && window.supabase);
    }

    function getClient() {
      if (supabaseClient) return supabaseClient;
      var c = resolveSupabaseCredentials();
      if (!c.url || !c.key) {
        showToast('Credenciais do Supabase não encontradas no config.js', 'error');
        return null;
      }
      if (!window.supabase) {
        showToast('Biblioteca Supabase não carregou. Verifique a conexão.', 'error');
        return null;
      }
      supabaseClient = window.supabase.createClient(c.url, c.key);
      return supabaseClient;
    }

    async function fetchAll() {
      var client = getClient();
      if (!client) { loadData(); return; }
      setLoading(true);
      try {
        var results = await Promise.all([
          client.from('orgaos').select('*').order('nome'),
          client.from('departamentos').select('*, orgaos(nome)').order('nome'),
          client.from('salas').select('*, departamentos(nome, orgaos(nome))').order('nome'),
          client.from('responsaveis').select('*').order('nome'),
          client.from('computadores').select('*, responsaveis(nome), salas(nome, departamentos(nome, orgaos(nome)))').order('nome')
        ]);
        if (results[0].error) throw results[0].error;
        if (results[1].error) throw results[1].error;
        if (results[2].error) throw results[2].error;
        if (results[3].error) throw results[3].error;
        if (results[4].error) throw results[4].error;
        cache.orgaos = results[0].data || [];
        cache.departamentos = results[1].data || [];
        cache.salas = results[2].data || [];
        cache.responsaveis = results[3].data || [];
        cache.computadores = results[4].data || [];
        loadData();
      } catch (err) {
        console.error(err);
        showToast('Erro ao carregar: ' + (err.message || err), 'error');
        loadData();
      } finally {
        setLoading(false);
      }
    }

    async function reloadAll() {
      await fetchAll();
      if (hasConfig()) showToast('Dados atualizados!', 'success');
    }

    function switchTab(tab) {
      currentTab = tab;
      currentPage = 0;
      editingId = null;
      document.querySelectorAll('.tab-btn').forEach(function(btn) {
        btn.className = 'tab-btn px-3 sm:px-4 py-2 rounded-lg text-xs sm:text-sm font-medium text-slate-600 hover:bg-slate-100 whitespace-nowrap shrink-0';
      });
      var active = document.getElementById('tab-' + tab);
      if (active) active.className = 'tab-btn px-3 sm:px-4 py-2 rounded-lg text-xs sm:text-sm font-medium bg-blue-600 text-white whitespace-nowrap shrink-0';
      var isComp = tab === 'computadores';
      var stats = document.getElementById('stats-section');
      var filter = document.getElementById('filter-status');
      var btnExport = document.getElementById('btn-export');
      if (stats) stats.classList.toggle('hidden', !isComp);
      if (filter) filter.classList.toggle('hidden', !isComp);
      if (btnExport) btnExport.classList.toggle('hidden', !isComp);
      var search = document.getElementById('search-input');
      if (search) search.value = '';
      loadData();
    }

    function getRawData() {
      return (cache[currentTab] || []).slice();
    }

    function loadData() {
      var data = getRawData();
      filteredData = data;
      if (currentTab === 'computadores') updateStats(data);
      handleSearch();
    }

    function updateStats(data) {
      var el;
      el = document.getElementById('stat-total'); if (el) el.textContent = data.length;
      el = document.getElementById('stat-ativos'); if (el) el.textContent = data.filter(function(c) { return c.status === 'Ativo'; }).length;
      el = document.getElementById('stat-inativos'); if (el) el.textContent = data.filter(function(c) { return c.status === 'Inativo'; }).length;
      el = document.getElementById('stat-manutencao'); if (el) el.textContent = data.filter(function(c) { return c.status === 'Em manutenção' || c.status === 'Em manutencao'; }).length;
    }

    function renderTable() {
      var headers = {
        orgaos: ['Nome', 'Criado em', 'Ações'],
        departamentos: ['Nome', 'Órgão', 'Criado em', 'Ações'],
        salas: ['Nome', 'Departamento', 'Órgão', 'Criado em', 'Ações'],
        responsaveis: ['Nome', 'E-mail', 'Telefone', 'Criado em', 'Ações'],
        computadores: ['Nome', 'AnyDesk', 'Responsável', 'Sala', 'Departamento', 'Órgão', 'Status', 'Ações']
      };
      var headerEl = document.getElementById('table-header');
      if (headerEl) {
        headerEl.innerHTML = (headers[currentTab] || []).map(function(h) {
          return '<th class="px-4 py-3 text-left text-xs font-semibold text-slate-500 uppercase tracking-wider">' + h + '</th>';
        }).join('');
      }
      var start = currentPage * PAGE_SIZE;
      var pageData = filteredData.slice(start, start + PAGE_SIZE);
      var tbody = document.getElementById('table-body');
      if (tbody) {
        if (pageData.length === 0) {
          tbody.innerHTML = '<tr><td colspan="10" class="text-center py-12 text-slate-400">Nenhum registro encontrado</td></tr>';
        } else {
          tbody.innerHTML = pageData.map(function(item) { return renderRow(item); }).join('');
        }
      }
      var cards = document.getElementById('cards-body');
      if (cards) {
        if (pageData.length === 0) {
          cards.innerHTML = '<div class="text-center py-12 text-slate-400 text-sm">Nenhum registro encontrado</div>';
        } else {
          cards.innerHTML = pageData.map(function(item) { return renderCard(item); }).join('');
        }
      }
      var info = document.getElementById('pagination-info');
      if (info) info.textContent = filteredData.length + ' registro(s)';
      var btnPrev = document.getElementById('btn-prev');
      var btnNext = document.getElementById('btn-next');
      if (btnPrev) btnPrev.disabled = currentPage === 0;
      if (btnNext) btnNext.disabled = start + PAGE_SIZE >= filteredData.length;
    }

    function renderRow(item) {
      var date = item.created_at ? new Date(item.created_at).toLocaleDateString('pt-BR') : '-';
      var actions = '<td class="px-4 py-3"><div class="flex gap-2">' +
        '<button type="button" onclick="editItem(\'' + item.id + '\')" class="text-blue-600 hover:text-blue-800 text-xs font-medium">Editar</button>' +
        '<button type="button" onclick="deleteItem(\'' + item.id + '\')" class="text-red-600 hover:text-red-800 text-xs font-medium">Excluir</button>' +
        '</div></td>';
      switch (currentTab) {
        case 'orgaos':
          return '<tr class="hover:bg-slate-50"><td class="px-4 py-3 font-medium">' + esc(item.nome) + '</td><td class="px-4 py-3 text-slate-500">' + date + '</td>' + actions + '</tr>';
        case 'departamentos':
          return '<tr class="hover:bg-slate-50"><td class="px-4 py-3 font-medium">' + esc(item.nome) + '</td><td class="px-4 py-3">' + esc(item.orgaos && item.orgaos.nome || '-') + '</td><td class="px-4 py-3 text-slate-500">' + date + '</td>' + actions + '</tr>';
        case 'salas':
          return '<tr class="hover:bg-slate-50"><td class="px-4 py-3 font-medium">' + esc(item.nome) + '</td><td class="px-4 py-3">' + esc(item.departamentos && item.departamentos.nome || '-') + '</td><td class="px-4 py-3">' + esc(item.departamentos && item.departamentos.orgaos && item.departamentos.orgaos.nome || '-') + '</td><td class="px-4 py-3 text-slate-500">' + date + '</td>' + actions + '</tr>';
        case 'responsaveis':
          return '<tr class="hover:bg-slate-50"><td class="px-4 py-3 font-medium">' + esc(item.nome) + '</td><td class="px-4 py-3">' + esc(item.email || '-') + '</td><td class="px-4 py-3">' + esc(item.telefone || '-') + '</td><td class="px-4 py-3 text-slate-500">' + date + '</td>' + actions + '</tr>';
        case 'computadores':
          var sc = item.status === 'Ativo' ? 'status-ativo' : (item.status === 'Inativo' ? 'status-inativo' : 'status-manutencao');
          var copyBtn = item.anydesk_id ? '<button type="button" onclick="copyAnydesk(\'' + esc(item.anydesk_id) + '\')" class="text-slate-400 hover:text-blue-600"><svg class="h-3.5 w-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg></button>' : '';
          return '<tr class="hover:bg-slate-50">' +
            '<td class="px-4 py-3 font-medium">' + esc(item.nome) + '</td>' +
            '<td class="px-4 py-3"><div class="flex items-center gap-2"><code class="bg-slate-100 px-2 py-0.5 rounded text-xs">' + esc(item.anydesk_id || '-') + '</code>' + copyBtn + '</div></td>' +
            '<td class="px-4 py-3">' + esc(item.responsaveis && item.responsaveis.nome || '-') + '</td>' +
            '<td class="px-4 py-3">' + esc(item.salas && item.salas.nome || '-') + '</td>' +
            '<td class="px-4 py-3">' + esc(item.salas && item.salas.departamentos && item.salas.departamentos.nome || '-') + '</td>' +
            '<td class="px-4 py-3">' + esc(item.salas && item.salas.departamentos && item.salas.departamentos.orgaos && item.salas.departamentos.orgaos.nome || '-') + '</td>' +
            '<td class="px-4 py-3"><span class="px-2 py-1 rounded-full text-xs font-medium ' + sc + '">' + esc(item.status) + '</span></td>' +
            actions + '</tr>';
        default: return '';
      }
    }

    function renderCard(item) {
      var date = item.created_at ? new Date(item.created_at).toLocaleDateString('pt-BR') : '-';
      var actions = '<div class="flex gap-2 mt-3 pt-3 border-t border-slate-100">' +
        '<button type="button" onclick="editItem(\'' + item.id + '\')" class="flex-1 py-2 text-blue-600 bg-blue-50 hover:bg-blue-100 active:bg-blue-200 rounded-lg text-xs font-medium transition">Editar</button>' +
        '<button type="button" onclick="deleteItem(\'' + item.id + '\')" class="flex-1 py-2 text-red-600 bg-red-50 hover:bg-red-100 active:bg-red-200 rounded-lg text-xs font-medium transition">Excluir</button>' +
        '</div>';
      switch (currentTab) {
        case 'orgaos':
          return '<div class="card-item p-4"><p class="font-semibold text-sm">' + esc(item.nome) + '</p><p class="text-xs text-slate-400 mt-1">Criado em ' + date + '</p>' + actions + '</div>';
        case 'departamentos':
          return '<div class="card-item p-4"><p class="font-semibold text-sm">' + esc(item.nome) + '</p><p class="text-xs text-slate-500 mt-1">' + esc(item.orgaos && item.orgaos.nome || '-') + '</p><p class="text-xs text-slate-400 mt-0.5">Criado em ' + date + '</p>' + actions + '</div>';
        case 'salas':
          return '<div class="card-item p-4"><p class="font-semibold text-sm">' + esc(item.nome) + '</p><p class="text-xs text-slate-500 mt-1">' + esc(item.departamentos && item.departamentos.nome || '-') + ' · ' + esc(item.departamentos && item.departamentos.orgaos && item.departamentos.orgaos.nome || '-') + '</p><p class="text-xs text-slate-400 mt-0.5">Criado em ' + date + '</p>' + actions + '</div>';
        case 'responsaveis':
          return '<div class="card-item p-4"><p class="font-semibold text-sm">' + esc(item.nome) + '</p><p class="text-xs text-slate-500 mt-1">' + esc(item.email || 'Sem e-mail') + '</p><p class="text-xs text-slate-500">' + esc(item.telefone || 'Sem telefone') + '</p>' + actions + '</div>';
        case 'computadores':
          var sc = item.status === 'Ativo' ? 'status-ativo' : (item.status === 'Inativo' ? 'status-inativo' : 'status-manutencao');
          var copyBtn = item.anydesk_id ? '<button type="button" onclick="copyAnydesk(\'' + esc(item.anydesk_id) + '\')" class="text-blue-600 text-xs font-medium">Copiar</button>' : '';
          return '<div class="card-item p-4">' +
            '<div class="flex items-start justify-between gap-2"><div class="min-w-0"><p class="font-semibold text-sm truncate">' + esc(item.nome) + '</p><p class="text-xs text-slate-500 mt-0.5 truncate">' + esc(item.responsaveis && item.responsaveis.nome || 'Sem responsável') + '</p></div>' +
            '<span class="px-2 py-0.5 rounded-full text-[10px] font-medium ' + sc + ' shrink-0">' + esc(item.status) + '</span></div>' +
            '<div class="flex items-center gap-2 mt-2"><code class="bg-slate-100 px-2 py-0.5 rounded text-xs">' + esc(item.anydesk_id || '-') + '</code>' + copyBtn + '</div>' +
            '<p class="text-xs text-slate-400 mt-1.5 truncate">' + esc(item.salas && item.salas.nome || '-') + ' · ' + esc(item.salas && item.salas.departamentos && item.salas.departamentos.nome || '-') + ' · ' + esc(item.salas && item.salas.departamentos && item.salas.departamentos.orgaos && item.salas.departamentos.orgaos.nome || '-') + '</p>' +
            actions + '</div>';
        default: return '';
      }
    }

    function handleSearch() {
      var searchEl = document.getElementById('search-input');
      var filterEl = document.getElementById('filter-status');
      var term = searchEl ? searchEl.value.toLowerCase().trim() : '';
      var statusFilter = filterEl ? filterEl.value : '';
      currentPage = 0;
      var data = getRawData();
      filteredData = data.filter(function(item) {
        var match = true;
        if (term) match = JSON.stringify(item).toLowerCase().indexOf(term) !== -1;
        if (match && statusFilter && currentTab === 'computadores') match = item.status === statusFilter;
        return match;
      });
      renderTable();
    }

    function changePage(dir) {
      currentPage += dir;
      renderTable();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function openModal(id) {
      editingId = id || null;
      var title = document.getElementById('modal-title');
      if (title) title.textContent = id ? 'Editar' : 'Novo';
      var fields = document.getElementById('form-fields');
      if (fields) fields.innerHTML = getFormFields();
      var modal = document.getElementById('modal');
      if (modal) modal.classList.remove('hidden');
      document.body.style.overflow = 'hidden';
      if (id) {
        var item = (cache[currentTab] || []).find(function(d) { return d.id === id; });
        if (item) fillForm(item);
      }
    }

    function closeModal() {
      var modal = document.getElementById('modal');
      if (modal) modal.classList.add('hidden');
      document.body.style.overflow = '';
      editingId = null;
    }

    function getFormFields() {
      var inputCls = 'w-full px-3 py-2.5 border border-slate-300 rounded-xl sm:rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none';
      var labelCls = 'block text-sm font-medium text-slate-700 mb-1';
      switch (currentTab) {
        case 'orgaos':
          return '<div><label class="' + labelCls + '">Nome do Órgão *</label><input name="nome" required class="' + inputCls + '" /></div>';
        case 'departamentos':
          var orgOpts = (cache.orgaos || []).map(function(o) { return '<option value="' + o.id + '">' + esc(o.nome) + '</option>'; }).join('');
          return '<div><label class="' + labelCls + '">Nome do Departamento *</label><input name="nome" required class="' + inputCls + '" /></div>' +
            '<div><label class="' + labelCls + '">Órgão *</label><select name="orgao_id" required class="' + inputCls + '"><option value="">Selecione...</option>' + orgOpts + '</select></div>';
        case 'salas':
          var depOpts = (cache.departamentos || []).map(function(d) {
            var orgNome = d.orgaos && d.orgaos.nome || '';
            return '<option value="' + d.id + '">' + esc(d.nome) + ' (' + esc(orgNome) + ')</option>';
          }).join('');
          return '<div><label class="' + labelCls + '">Nome da Sala *</label><input name="nome" required class="' + inputCls + '" /></div>' +
            '<div><label class="' + labelCls + '">Departamento *</label><select name="departamento_id" required class="' + inputCls + '"><option value="">Selecione...</option>' + depOpts + '</select></div>';
        case 'responsaveis':
          return '<div><label class="' + labelCls + '">Nome *</label><input name="nome" required class="' + inputCls + '" /></div>' +
            '<div><label class="' + labelCls + '">E-mail</label><input name="email" type="email" class="' + inputCls + '" /></div>' +
            '<div><label class="' + labelCls + '">Telefone</label><input name="telefone" class="' + inputCls + '" /></div>';
        case 'computadores':
          var respOpts = (cache.responsaveis || []).map(function(r) { return '<option value="' + r.id + '">' + esc(r.nome) + '</option>'; }).join('');
          var salaOpts = (cache.salas || []).map(function(s) {
            var depNome = s.departamentos && s.departamentos.nome || '';
            var orgNome = s.departamentos && s.departamentos.orgaos && s.departamentos.orgaos.nome || '';
            return '<option value="' + s.id + '">' + esc(s.nome) + ' — ' + esc(depNome) + ' / ' + esc(orgNome) + '</option>';
          }).join('');
          return '<div><label class="' + labelCls + '">Nome / Identificação *</label><input name="nome" required class="' + inputCls + '" placeholder="Ex: PC-Recepção-01" /></div>' +
            '<div><label class="' + labelCls + '">ID AnyDesk *</label><input name="anydesk_id" required class="' + inputCls + '" placeholder="Ex: 123 456 789" /></div>' +
            '<div><label class="' + labelCls + '">Responsável</label><select name="responsavel_id" class="' + inputCls + '"><option value="">Nenhum</option>' + respOpts + '</select></div>' +
            '<div><label class="' + labelCls + '">Sala *</label><select name="sala_id" required class="' + inputCls + '"><option value="">Selecione...</option>' + salaOpts + '</select></div>' +
            '<div><label class="' + labelCls + '">Status *</label><select name="status" required class="' + inputCls + '"><option value="Ativo">Ativo</option><option value="Inativo">Inativo</option><option value="Em manutenção">Em manutenção</option></select></div>' +
            '<div><label class="' + labelCls + '">Observações</label><textarea name="observacoes" rows="2" class="' + inputCls + '"></textarea></div>';
        default: return '';
      }
    }

    function fillForm(item) {
      var form = document.getElementById('modal-form');
      if (!form) return;
      Object.keys(item).forEach(function(key) {
        var el = form.elements[key];
        if (el) el.value = item[key] != null ? item[key] : '';
      });
    }

    async function saveItem(e) {
      e.preventDefault();
      var client = getClient();
      if (!client) return;
      var btn = document.getElementById('btn-save');
      if (btn) { btn.disabled = true; btn.textContent = 'Salvando...'; }
      try {
        var formData = new FormData(e.target);
        var data = Object.fromEntries(formData.entries());
        ['orgao_id', 'departamento_id', 'sala_id', 'responsavel_id'].forEach(function(k) {
          if (data[k] === '') data[k] = null;
        });
        delete data.id; delete data.created_at; delete data.updated_at;
        delete data.orgaos; delete data.departamentos; delete data.salas; delete data.responsaveis;
        var result;
        if (editingId) {
          result = await client.from(currentTab).update(data).eq('id', editingId).select();
        } else {
          result = await client.from(currentTab).insert([data]).select();
        }
        if (result.error) throw result.error;
        showToast(editingId ? 'Atualizado com sucesso!' : 'Cadastrado com sucesso!', 'success');
        closeModal();
        await fetchAll();
      } catch (err) {
        console.error(err);
        showToast('Erro ao salvar: ' + (err.message || err), 'error');
      } finally {
        if (btn) { btn.disabled = false; btn.textContent = 'Salvar'; }
      }
    }

    function editItem(id) { openModal(id); }

    async function deleteItem(id) {
      if (!confirm('Tem certeza que deseja excluir?')) return;
      var client = getClient();
      if (!client) return;
      setLoading(true);
      try {
        if (currentTab === 'orgaos') {
          var r1 = await client.from('departamentos').select('*', { count: 'exact', head: true }).eq('orgao_id', id);
          if (r1.count > 0) { showToast('Existem departamentos vinculados.', 'error'); return; }
        }
        if (currentTab === 'departamentos') {
          var r2 = await client.from('salas').select('*', { count: 'exact', head: true }).eq('departamento_id', id);
          if (r2.count > 0) { showToast('Existem salas vinculadas.', 'error'); return; }
        }
        if (currentTab === 'salas') {
          var r3 = await client.from('computadores').select('*', { count: 'exact', head: true }).eq('sala_id', id);
          if (r3.count > 0) { showToast('Existem computadores vinculados.', 'error'); return; }
        }
        if (currentTab === 'responsaveis') {
          var r4 = await client.from('computadores').select('*', { count: 'exact', head: true }).eq('responsavel_id', id);
          if (r4.count > 0) { showToast('Existem computadores vinculados.', 'error'); return; }
        }
        var result = await client.from(currentTab).delete().eq('id', id);
        if (result.error) throw result.error;
        showToast('Excluído com sucesso!', 'success');
        await fetchAll();
      } catch (err) {
        console.error(err);
        showToast('Erro ao excluir: ' + (err.message || err), 'error');
      } finally {
        setLoading(false);
      }
    }

    function copyAnydesk(id) {
      if (navigator.clipboard) {
        navigator.clipboard.writeText(id).then(function() { showToast('AnyDesk copiado!', 'success'); });
      } else {
        showToast('Não foi possível copiar', 'error');
      }
    }

    function exportCSV() {
      if (currentTab !== 'computadores' || filteredData.length === 0) {
        showToast('Nenhum dado para exportar', 'error');
        return;
      }
      var headers = ['Nome', 'AnyDesk', 'Responsável', 'Sala', 'Departamento', 'Órgão', 'Status', 'Observações'];
      var rows = filteredData.map(function(c) {
        return [
          c.nome, c.anydesk_id,
          c.responsaveis && c.responsaveis.nome || '',
          c.salas && c.salas.nome || '',
          c.salas && c.salas.departamentos && c.salas.departamentos.nome || '',
          c.salas && c.salas.departamentos && c.salas.departamentos.orgaos && c.salas.departamentos.orgaos.nome || '',
          c.status, c.observacoes || ''
        ];
      });
      var csv = [headers].concat(rows).map(function(r) {
        return r.map(function(v) { return '"' + String(v || '').replace(/"/g, '""') + '"'; }).join(',');
      }).join('\n');
      var blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
      var link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = 'anymap-computadores.csv';
      link.click();
      showToast('CSV exportado!', 'success');
    }

    function init() {
      // config.js já foi carregado no <head> (síncrono)
      if (!hasConfig()) {
        var banner = document.getElementById('config-banner');
        if (banner) banner.classList.remove('hidden');
        console.warn('AnyMap: credenciais não encontradas. Formatos aceitos no config.js:');
        console.warn('  window.SUPABASE_URL + window.SUPABASE_ANON_KEY');
        console.warn('  window.config.SUPABASE_URL + window.config.SUPABASE_ANON_KEY');
        console.warn('  window.supabaseConfig.url + window.supabaseConfig.anonKey');
      }
      fetchAll();
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  </script>
</body>
</html>
