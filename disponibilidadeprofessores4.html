<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Disponibilidade - Professores</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <style>
    .tag {
      display: inline-block;
      font-size: 0.75rem;
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      background-color: #e0e7ff;
      color: #4338ca;
    }
  </style>
</head>
<body class="bg-gray-50 min-h-screen">

  <div class="max-w-6xl mx-auto p-6">
    <h1 class="text-4xl font-bold text-center text-indigo-700 mb-8">Disponibilidade dos Melhores Professores do Brasil</h1>

    <!-- Formulário de Cadastro -->
    <div class="bg-white rounded-2xl shadow-lg p-8 mb-10">
      <h2 class="text-2xl font-semibold mb-6">Cadastrar Professor</h2>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <div>
          <label class="block text-sm font-medium mb-2">Nome do Professor</label>
          <input id="nome" type="text" class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:border-indigo-500" placeholder="Ex: Maria Silva">
        </div>
        <div>
          <label class="block text-sm font-medium mb-2">Cor (opcional)</label>
          <input id="cor" type="color" value="#4f46e5" class="w-full h-12 border border-gray-300 rounded-lg p-1">
        </div>
      </div>

      <div class="mt-8">
        <div class="flex flex-wrap items-center justify-between gap-3 mb-3">
          <label class="block text-sm font-medium text-gray-800">Disponibilidade por Dia e Horário</label>
          <div class="flex gap-2">
            <button type="button" onclick="selecionarTodos()" class="text-xs bg-indigo-100 hover:bg-indigo-200 text-indigo-700 px-3 py-1.5 rounded-lg font-medium">
              Selecionar todos
            </button>
            <button type="button" onclick="limparTodos()" class="text-xs bg-gray-100 hover:bg-gray-200 text-gray-700 px-3 py-1.5 rounded-lg font-medium">
              Limpar todos
            </button>
          </div>
        </div>
        <p class="text-sm text-gray-500 mb-4">Marque os horários disponíveis em cada dia da semana individualmente.</p>
        
    
        <div id="disponibilidade-matrix" class="space-y-4"></div>
      </div>

      <button onclick="cadastrarProfessor()" class="mt-10 w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-4 rounded-xl text-lg">
        <i class="fas fa-save mr-2"></i> Cadastrar Professor
      </button>
    </div>

 
    <div class="bg-white rounded-2xl shadow-lg p-8">
      <div class="flex flex-wrap justify-between items-center gap-4 mb-6">
        <h2 class="text-2xl font-semibold">Professores Cadastrados</h2>
        <button onclick="gerarRelatorioPDF()" class="flex items-center gap-2 bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-3 rounded-xl">
          <i class="fas fa-file-pdf"></i> Gerar Relatório PDF
        </button>
      </div>
      <div id="lista-professores" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
    </div>
  </div>

  <script>
 
    let supabaseClient = null;
    try {
      if (window.SUPABASE_CONFIG && window.SUPABASE_CONFIG.url && window.SUPABASE_CONFIG.key) {
        supabaseClient = supabase.createClient(window.SUPABASE_CONFIG.url, window.SUPABASE_CONFIG.key);
      } else {
        console.warn("config.js ou SUPABASE_CONFIG não encontrado. Cadastro/lista não funcionarão até configurar.");
      }
    } catch (e) {
      console.warn("Erro ao inicializar Supabase:", e);
    }

    const diasSemana = ["segunda", "terca", "quarta", "quinta", "sexta"];
    const diasLabels = {
      segunda: "Segunda-feira",
      terca: "Terça-feira",
      quarta: "Quarta-feira",
      quinta: "Quinta-feira",
      sexta: "Sexta-feira"
    };
    const horariosFixos = [
   
      "07:00 - 07:45", "07:45 - 08:30", "08:30 - 09:15", "09:30 - 10:15", "10:15 - 11:00", "11:00 - 11:45",
    
      "13:00 - 13:35", "13:35 - 14:10", "14:10 - 14:45",
      "15:00 - 15:35", "15:35 - 16:10", "16:10 - 16:45",
    
      "19:00 - 19:35", "19:35 - 20:10", "20:10 - 20:40",
      "21:00 - 21:35", "21:35 - 22:10"
    ];

    function renderDisponibilidadeMatrix() {
      const container = document.getElementById("disponibilidade-matrix");
      if (!container) return;

      container.innerHTML = diasSemana.map(dia => `
        <div class="border border-gray-200 rounded-xl overflow-hidden bg-gray-50">
          <div class="flex items-center justify-between px-4 py-3 bg-indigo-50 border-b border-indigo-100">
            <h3 class="font-semibold text-indigo-800">${diasLabels[dia]}</h3>
            <label class="flex items-center gap-2 text-sm text-indigo-700 cursor-pointer select-none">
              <input type="checkbox" class="w-4 h-4 accent-indigo-600" 
                     onchange="toggleDia('${dia}', this.checked)" checked>
              <span>Todos</span>
            </label>
          </div>
          <div class="p-4 grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-2">
            ${horariosFixos.map(h => `
              <label class="flex items-center gap-2 cursor-pointer bg-white hover:bg-indigo-50 border border-gray-200 rounded-lg px-3 py-2 text-sm transition">
                <input type="checkbox" 
                       data-dia="${dia}" 
                       data-horario="${h}" 
                       class="w-4 h-4 accent-indigo-600 disponibilidade-check flex-shrink-0"
                       checked>
                <span class="text-gray-700">${h}</span>
              </label>
            `).join('')}
          </div>
        </div>
      `).join('');
    }

    function toggleDia(dia, checked) {
      document.querySelectorAll(`.disponibilidade-check[data-dia="${dia}"]`).forEach(cb => {
        cb.checked = checked;
      });
    }

    function selecionarTodos() {
      document.querySelectorAll('.disponibilidade-check').forEach(cb => cb.checked = true);
      document.querySelectorAll('#disponibilidade-matrix input[type="checkbox"]').forEach(cb => {
        if (!cb.classList.contains('disponibilidade-check')) cb.checked = true;
      });
    }

    function limparTodos() {
      document.querySelectorAll('.disponibilidade-check').forEach(cb => cb.checked = false);
      document.querySelectorAll('#disponibilidade-matrix input[type="checkbox"]').forEach(cb => {
        if (!cb.classList.contains('disponibilidade-check')) cb.checked = false;
      });
    }

    function coletarDisponibilidade() {
      const disponibilidade = {};
      diasSemana.forEach(dia => {
        disponibilidade[dia] = [];
      });

      document.querySelectorAll('.disponibilidade-check:checked').forEach(cb => {
        const dia = cb.dataset.dia;
        const horario = cb.dataset.horario;
        if (disponibilidade[dia]) {
          disponibilidade[dia].push(horario);
        }
      });

      // Remove dias sem nenhum horário marcado
      Object.keys(disponibilidade).forEach(dia => {
        if (disponibilidade[dia].length === 0) {
          delete disponibilidade[dia];
        }
      });

      return disponibilidade;
    }

    async function cadastrarProfessor() {
      if (!supabaseClient) {
        return alert("❌ Configuração do Supabase não encontrada (config.js). Não é possível cadastrar.");
      }

      const nome = document.getElementById("nome").value.trim();
      const cor = document.getElementById("cor").value;

      if (!nome) return alert("❌ Digite o nome do professor");

      const disponibilidade = coletarDisponibilidade();
      const totalSelecionados = Object.values(disponibilidade).reduce((acc, arr) => acc + arr.length, 0);

      if (totalSelecionados === 0) {
        return alert("❌ Selecione pelo menos um horário em algum dia da semana");
      }

      const professor = {
        nome,
        cor,
        disponibilidade,
        criado_em: new Date().toISOString()
      };

      const { error } = await supabaseClient.from('professores').insert([professor]);

      if (error) {
        alert("Erro ao cadastrar: " + error.message);
      } else {
        alert(`✅ Professor ${nome} cadastrado com sucesso!`);
        document.getElementById("nome").value = "";
        carregarProfessores();
      }
    }

    function formatarDisponibilidadeHTML(disponibilidade) {
      if (!disponibilidade || typeof disponibilidade !== 'object') {
        return '<span class="text-gray-400">Não informado</span>';
      }

      // Compatibilidade com formato antigo
      if (Array.isArray(disponibilidade.dias) || Array.isArray(disponibilidade.horarios)) {
        const dias = disponibilidade.dias || [];
        const horarios = disponibilidade.horarios || [];
        return `
          <div class="flex flex-wrap gap-2 mb-2">
            ${dias.map(d => `<span class="tag">${(d || '').substring(0,3).toUpperCase()}</span>`).join('')}
          </div>
          <div class="text-sm text-gray-600">
            <strong>Horários (geral):</strong><br>
            ${horarios.length ? horarios.join(" • ") : 'Não informado'}
          </div>
        `;
      }

      // Novo formato: { segunda: [...], terca: [...] }
      const diasComHorarios = diasSemana.filter(d => disponibilidade[d] && disponibilidade[d].length > 0);
      if (diasComHorarios.length === 0) {
        return '<span class="text-gray-400">Nenhuma disponibilidade cadastrada</span>';
      }

      return diasComHorarios.map(dia => `
        <div class="mb-3 last:mb-0">
          <span class="tag mb-1 inline-block">${diasLabels[dia] || dia}</span>
          <div class="text-sm text-gray-600 mt-1">
            ${disponibilidade[dia].join(" • ")}
          </div>
        </div>
      `).join('');
    }

    async function carregarProfessores() {
      const container = document.getElementById("lista-professores");
      if (!container) return;

      if (!supabaseClient) {
        container.innerHTML = `<p class="text-amber-600 text-center py-6">⚠️ Configure o arquivo <code>config.js</code> com as credenciais do Supabase para carregar os professores.</p>`;
        return;
      }

      const { data, error } = await supabaseClient.from('professores').select('*').order('nome');

      if (error) {
        container.innerHTML = `<p class="text-red-500">Erro ao carregar professores: ${error.message}</p>`;
        return;
      }

      if (!data || data.length === 0) {
        container.innerHTML = `<p class="text-gray-500 text-center py-10">Nenhum professor cadastrado ainda.</p>`;
        return;
      }

      container.innerHTML = data.map(p => `
        <div class="border border-gray-200 rounded-2xl p-6">
          <div class="flex items-start gap-4">
            <div class="w-10 h-10 rounded-full flex-shrink-0 mt-1" style="background-color: ${p.cor || '#4f46e5'}"></div>
            <div class="flex-1 min-w-0">
              <h3 class="font-bold text-lg">${p.nome}</h3>
              <div class="mt-3">
                ${formatarDisponibilidadeHTML(p.disponibilidade)}
              </div>
            </div>
          </div>
        </div>
      `).join('');
    }

    async function gerarRelatorioPDF() {
      if (!supabaseClient) {
        return alert("❌ Configuração do Supabase não encontrada.");
      }

      const { data: professores, error } = await supabaseClient.from('professores').select('*').order('nome');
      if (error || !professores || professores.length === 0) {
        return alert("Nenhum professor encontrado para gerar o relatório.");
      }

      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF('portrait', 'pt', 'a4');
      const pageWidth = pdf.internal.pageSize.getWidth();

      pdf.setFont("helvetica", "bold");
      pdf.setFontSize(22);
      pdf.text("RELATÓRIO DE DISPONIBILIDADE", pageWidth / 2, 50, { align: "center" });
      pdf.setFontSize(12);
      pdf.text(`Gerado em: ${new Date().toLocaleDateString('pt-BR')}`, pageWidth / 2, 75, { align: "center" });

      let y = 110;

      professores.forEach((prof) => {
        if (y > 680) {
          pdf.addPage();
          y = 60;
        }

        pdf.setFont("helvetica", "bold");
        pdf.setFontSize(16);
        pdf.text(prof.nome, 50, y);
        y += 22;

        pdf.setFont("helvetica", "normal");
        pdf.setFontSize(11);

        const disp = prof.disponibilidade || {};

        if (Array.isArray(disp.dias) || Array.isArray(disp.horarios)) {
          pdf.text("Dias disponíveis: " + (disp.dias?.join(", ") || "Nenhum"), 50, y);
          y += 18;
          const horarios = disp.horarios || [];
          if (horarios.length) {
            pdf.text("Horários (geral):", 50, y);
            y += 16;
            for (let i = 0; i < horarios.length; i += 3) {
              const linha = horarios.slice(i, i + 3).join("  •  ");
              pdf.text(linha, 70, y);
              y += 16;
            }
          }
        } else {
          const diasComHorarios = diasSemana.filter(d => disp[d] && disp[d].length > 0);
          if (diasComHorarios.length === 0) {
            pdf.text("Nenhuma disponibilidade cadastrada", 50, y);
            y += 18;
          } else {
            diasComHorarios.forEach(dia => {
              if (y > 720) {
                pdf.addPage();
                y = 60;
              }
              pdf.setFont("helvetica", "bold");
              pdf.text((diasLabels[dia] || dia) + ":", 50, y);
              y += 16;
              pdf.setFont("helvetica", "normal");
              const horarios = disp[dia];
              for (let i = 0; i < horarios.length; i += 3) {
                const linha = horarios.slice(i, i + 3).join("  •  ");
                pdf.text(linha, 70, y);
                y += 15;
              }
              y += 8;
            });
          }
        }

        y += 20;
      });

      pdf.save("Relatorio_Disponibilidade_Professores.pdf");
    }

    // Inicialização — garante que a matriz sempre aparece
    function init() {
      renderDisponibilidadeMatrix();
      carregarProfessores();
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  </script>
</body>
</html>
