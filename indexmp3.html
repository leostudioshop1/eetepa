<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campeões JOPEX 26 - EETEPA Xinguara</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #0a1628, #1a2a4a, #0f1c2e);
      color: #fff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .player-container {
      background: #0f1c2e;
      border-radius: 20px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255,255,255,0.05);
      overflow: hidden;
    }

    .cover-section {
      position: relative;
      width: 100%;
      background: #0a1628;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px 20px 10px;
    }

    .cover-section img {
      width: 100%;
      max-width: 320px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      display: block;
    }

    .header {
      background: linear-gradient(180deg, #0f3460 0%, #0a2540 100%);
      padding: 15px 20px 18px;
      text-align: center;
    }

    .header h1 {
      font-size: 1.25rem;
      margin-bottom: 6px;
      color: #fff;
      letter-spacing: 0.5px;
    }

    .header .subtitle {
      font-size: 0.85rem;
      color: #7eb8ff;
      margin-bottom: 8px;
    }

    .now-playing {
      font-size: 0.9rem;
      color: #ffd700;
      font-weight: 600;
      min-height: 22px;
    }

    .controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 22px;
      padding: 18px 20px;
      background: #0a1628;
    }

    .controls button {
      background: linear-gradient(145deg, #1e90ff, #0d6efd);
      border: none;
      color: white;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      font-size: 1.2rem;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px rgba(13, 110, 253, 0.4);
    }

    .controls button:hover {
      background: linear-gradient(145deg, #4dabf7, #1e90ff);
      transform: scale(1.08);
    }

    .controls button:active {
      transform: scale(0.95);
    }

    #playPauseBtn {
      width: 64px;
      height: 64px;
      font-size: 1.5rem;
      background: linear-gradient(145deg, #ffd700, #f0a500);
      color: #1a1a2e;
      box-shadow: 0 4px 15px rgba(255, 215, 0, 0.45);
    }

    #playPauseBtn:hover {
      background: linear-gradient(145deg, #ffe44d, #ffd700);
    }

    .playlist {
      max-height: 380px;
      overflow-y: auto;
      padding: 8px 0;
      background: #0f1c2e;
    }

    .playlist::-webkit-scrollbar {
      width: 6px;
    }

    .playlist::-webkit-scrollbar-thumb {
      background: #1e90ff;
      border-radius: 10px;
    }

    .song-item {
      display: flex;
      align-items: center;
      padding: 12px 18px;
      cursor: pointer;
      transition: background 0.2s;
      border-left: 4px solid transparent;
    }

    .song-item:hover {
      background: rgba(30, 144, 255, 0.12);
    }

    .song-item.active {
      background: rgba(30, 144, 255, 0.22);
      border-left: 4px solid #ffd700;
    }

    .song-number {
      width: 28px;
      font-weight: 700;
      color: #7eb8ff;
      font-size: 0.9rem;
      flex-shrink: 0;
    }

    .song-item.active .song-number {
      color: #ffd700;
    }

    .song-info {
      flex: 1;
      min-width: 0;
    }

    .song-title {
      font-size: 0.92rem;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .song-item.active .song-title {
      color: #ffd700;
    }

    .playing-icon {
      margin-left: 8px;
      color: #ffd700;
      font-size: 0.85rem;
      display: none;
      flex-shrink: 0;
    }

    .song-item.active .playing-icon {
      display: inline;
    }

    .footer {
      text-align: center;
      padding: 12px;
      font-size: 0.75rem;
      color: #7a9bb8;
      background: #0a1628;
      border-top: 1px solid rgba(255,255,255,0.05);
    }

    .footer strong {
      color: #7eb8ff;
    }
  </style>
</head>
<body>

  <div class="player-container">
    <div class="cover-section">
      <img src="capa.png" alt="Capa CD - Campeões JOPEX 26 - EETEPA Xinguara">
    </div>

    <div class="header">
      <h1>🏆 Campeões JOPEX 26</h1>
      <div class="subtitle">EETEPA Xinguara • Juntos Somos Mais Fortes!</div>
      <div class="now-playing" id="nowPlaying">Nenhuma música tocando</div>
    </div>

    <div class="controls">
      <button id="prevBtn" title="Anterior">⏮</button>
      <button id="playPauseBtn" title="Play/Pause">▶️</button>
      <button id="nextBtn" title="Próxima">⏭</button>
    </div>

    <div class="playlist" id="playlist">
      <!-- As músicas serão inseridas via JavaScript -->
    </div>

    <div class="footer">
      <strong>EETEPA Xinguara</strong> • Clique em qualquer música para tocar
    </div>
  </div>

  <audio id="audioPlayer"></audio>

  <script>
    // ============================================
    // ✏️ LISTA DE MÚSICAS - Campeões JOPEX 26
    // Coloque os arquivos MP3 na mesma pasta deste HTML
    // ============================================
    const songs = [
      { title: "01 - HINO OFICIAL EEtepa!", file: "musica1.mp3" },
      { title: "02 - Nascemos Para Vencer", file: "musica2.mp3" },
      { title: "03 - Arena da EETEPA", file: "musica3.mp3" },
      { title: "04 - Chegou a Taça", file: "musica4.mp3" },
      { title: "05 - EETEPA HOJE A TAÇA VAI CHEGAR samba", file: "musica5.mp3" },
      { title: "06 - A TAÇA É NOSSA", file: "musica6.mp3" },
      { title: "07 - EETEPA Vai Passar - Brega", file: "musica7.mp3" },
      { title: "08 - EETEPA Número Um - Reggae", file: "musica8.mp3" },
      { title: "09 - EetePA Vai Vencer", file: "musica9.mp3" },
      { title: "10 - Um Só Coração - Viking (faixa bônus)", file: "musica10.mp3" }
    ];

    // ============================================
    // Código do player
    // ============================================

    const audio = document.getElementById('audioPlayer');
    const playlistEl = document.getElementById('playlist');
    const nowPlayingEl = document.getElementById('nowPlaying');
    const playPauseBtn = document.getElementById('playPauseBtn');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');

    let currentIndex = -1;
    let isPlaying = false;

    // Criar a lista de músicas
    function renderPlaylist() {
      playlistEl.innerHTML = '';
      songs.forEach((song, index) => {
        const item = document.createElement('div');
        item.className = 'song-item';
        item.innerHTML = `
          <div class="song-number">${index + 1}</div>
          <div class="song-info">
            <div class="song-title">${song.title}</div>
          </div>
          <div class="playing-icon">▶</div>
        `;
        item.addEventListener('click', () => playSong(index));
        playlistEl.appendChild(item);
      });
    }

    // Tocar uma música específica
    function playSong(index) {
      if (index < 0 || index >= songs.length) return;

      currentIndex = index;
      audio.src = songs[index].file;
      audio.play();
      isPlaying = true;

      updateUI();
    }

    // Atualizar interface
    function updateUI() {
      // Destacar música atual
      const items = document.querySelectorAll('.song-item');
      items.forEach((item, i) => {
        item.classList.toggle('active', i === currentIndex);
      });

      // Atualizar texto "tocando agora"
      if (currentIndex >= 0) {
        nowPlayingEl.textContent = `Tocando: ${songs[currentIndex].title}`;
      } else {
        nowPlayingEl.textContent = 'Nenhuma música tocando';
      }

      // Atualizar botão play/pause
      playPauseBtn.textContent = isPlaying ? '⏸️' : '▶️';
    }

    // Play / Pause
    playPauseBtn.addEventListener('click', () => {
      if (currentIndex === -1) {
        // Se nenhuma música estiver selecionada, começa da primeira
        playSong(0);
        return;
      }

      if (isPlaying) {
        audio.pause();
        isPlaying = false;
      } else {
        audio.play();
        isPlaying = true;
      }
      updateUI();
    });

    // Música anterior
    prevBtn.addEventListener('click', () => {
      if (currentIndex > 0) {
        playSong(currentIndex - 1);
      } else {
        playSong(songs.length - 1); // volta para a última
      }
    });

    // Próxima música
    nextBtn.addEventListener('click', () => {
      if (currentIndex < songs.length - 1) {
        playSong(currentIndex + 1);
      } else {
        // Para na última
        audio.pause();
        isPlaying = false;
        updateUI();
      }
    });

    // Quando a música terminar, toca a próxima automaticamente
    audio.addEventListener('ended', () => {
      if (currentIndex < songs.length - 1) {
        playSong(currentIndex + 1);
      } else {
        // Chegou no final da lista
        isPlaying = false;
        updateUI();
        nowPlayingEl.textContent = 'Fim da playlist 🏆';
      }
    });

    // Inicializar
    renderPlaylist();
  </script>
</body>
</html>
