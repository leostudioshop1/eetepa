<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Total Atual de Visitantes — Feira das Profissões 2026</title>
  <script src="https://cdn.jsdelivr.net/npm/dexie@4.0.10/dist/dexie.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: #050508;
      color: #ffffff;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* Fundo com brilho suave */
    .bg {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 90% 55% at 50% 45%, rgba(34, 197, 94, 0.18) 0%, transparent 55%),
        radial-gradient(ellipse 70% 40% at 50% 85%, rgba(16, 185, 129, 0.1) 0%, transparent 50%);
      pointer-events: none;
    }

    .wrap {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 1.5rem 2rem;
      width: 100%;
    }

    /* Título grande e bem legível de longe */
    .title {
      font-size: clamp(1.4rem, 4.2vw, 3.2rem);
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #4ade80;
      line-height: 1.25;
      text-shadow:
        0 0 20px rgba(74, 222, 128, 0.5),
        0 0 40px rgba(74, 222, 128, 0.25),
        0 2px 4px rgba(0,0,0,0.5);
      margin-bottom: 1.2rem;
      max-width: 95vw;
      margin-left: auto;
      margin-right: auto;
    }

    /* Número ENORME */
    #total {
      font-size: clamp(7rem, 32vw, 22rem);
      font-weight: 900;
      line-height: 0.95;
      letter-spacing: -0.04em;
      color: #ffffff;
      font-variant-numeric: tabular-nums;
      text-shadow:
        0 0 30px rgba(34, 197, 94, 0.55),
        0 0 80px rgba(34, 197, 94, 0.3),
        0 0 120px rgba(34, 197, 94, 0.15),
        0 4px 12px rgba(0,0,0,0.6);
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), color 0.25s ease;
    }

    /* Animação quando o número sobe */
    #total.bump {
      transform: scale(1.08);
      color: #4ade80;
    }

    /* Pequeno indicador discreto no canto (quase invisível de longe) */
    .status {
      position: absolute;
      bottom: 1rem;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 0.7rem;
      color: #334155;
      opacity: 0.5;
      letter-spacing: 0.04em;
    }
  </style>
</head>
<body>
  <div class="bg"></div>

  <div class="wrap">
    <h1 class="title">TOTAL ATUAL DE VISITANTES<br>FEIRA DAS PROFISSÕES 2026</h1>
    <div id="total">—</div>
  </div>

  <div class="status" id="status">conectando…</div>

  <script>
    // Mesmo banco IndexedDB do contador original
    const db = new Dexie('PeopleCounterDB');
    db.version(1).stores({
      events: 'id, timestamp, date, hour, type, trackingId, sessionId',
      settings: 'id'
    });
    db.version(2).stores({
      events: 'id, timestamp, date, hour, type, trackingId, sessionId, synced',
      settings: 'id'
    });

    const totalEl = document.getElementById('total');
    const statusEl = document.getElementById('status');
    let lastTotal = -1;

    function formatNumber(n) {
      return n.toLocaleString('pt-BR');
    }

    async function loadTotal() {
      try {
        const total = await db.events.where('type').equals('in').count();

        if (lastTotal >= 0 && total !== lastTotal) {
          totalEl.classList.add('bump');
          setTimeout(() => totalEl.classList.remove('bump'), 350);
        }
        lastTotal = total;

        totalEl.textContent = formatNumber(total);
        statusEl.textContent = '';
      } catch (err) {
        console.error(err);
        if (lastTotal < 0) {
          totalEl.textContent = '0';
          statusEl.textContent = 'banco não encontrado';
        }
      }
    }

    async function init() {
      try {
        await db.open();
        await loadTotal();
        setInterval(loadTotal, 2000); // atualiza a cada 2s
      } catch (err) {
        console.error(err);
        totalEl.textContent = '0';
        statusEl.textContent = 'erro ao abrir banco';
      }
    }

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') loadTotal();
    });

    init();
  </script>
</body>
</html>
