<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Vote 10111 - Deputada Estadual</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: linear-gradient(160deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 8px;
      color: #ff69b4;
      text-shadow: 0 0 12px rgba(255,105,180,0.6);
    }
    .subtitle {
      font-size: 0.95rem;
      color: #a0aec0;
      margin-bottom: 20px;
    }
    .card {
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(10px);
      border-radius: 24px;
      padding: 24px 20px;
      max-width: 360px;
      width: 100%;
      box-shadow: 0 15px 40px rgba(0,0,0,0.4);
      border: 1px solid rgba(255,255,255,0.1);
    }
    img {
      width: 100%;
      max-width: 280px;
      border-radius: 16px;
      display: block;
      margin: 0 auto;
      filter: drop-shadow(0 8px 20px rgba(255,105,180,0.3));
    }
    .btn {
      display: block;
      width: 100%;
      margin-top: 24px;
      padding: 18px;
      font-size: 1.25rem;
      font-weight: 700;
      color: #fff;
      background: linear-gradient(135deg, #ff69b4, #ff1493);
      border: none;
      border-radius: 50px;
      cursor: pointer;
      text-decoration: none;
      box-shadow: 0 6px 20px rgba(255,20,147,0.45);
      transition: transform 0.15s, box-shadow 0.15s;
      letter-spacing: 0.5px;
    }
    .btn:active {
      transform: scale(0.97);
      box-shadow: 0 3px 10px rgba(255,20,147,0.4);
    }
    .hint {
      margin-top: 16px;
      font-size: 0.85rem;
      color: #a0aec0;
      line-height: 1.45;
    }
    .number {
      font-size: 2.2rem;
      font-weight: 900;
      color: #fff;
      margin: 12px 0 4px;
      text-shadow: 0 0 15px rgba(255,105,180,0.5);
    }
  </style>
</head>
