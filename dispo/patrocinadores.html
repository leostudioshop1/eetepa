<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Vídeos</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: system-ui, -apple-system, sans-serif;
    }

    #player {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #000;
      z-index: 1;
    }

    #btnToggle {
      position: fixed;
      bottom: 28px;
      right: 28px;
      z-index: 100;
      width: 64px;
      height: 64px;
      border-radius: 50%;
      border: none;
      background: rgba(30, 30, 40, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      transition: all 0.25s ease;
      outline: none;
    }

    #btnToggle:hover {
      transform: scale(1.08);
      background: rgba(50, 50, 70, 0.85);
    }

    #btnToggle.active {
      background: rgba(220, 38, 38, 0.85);
      box-shadow: 0 0 0 6px rgba(220, 38, 38, 0.25);
    }

    #btnToggle.active:hover {
      background: rgba(239, 68, 68, 0.9);
    }

    .mic-icon {
      width: 28px;
      height: 28px;
      fill: currentColor;
    }

    #listeningDot {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 100;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #22c55e;
      opacity: 0;
      transition: opacity 0.3s;
      box-shadow: 0 0 8px #22c55e;
    }

    #listeningDot.visible {
      opacity: 1;
      animation: pulse 1.4s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.3); opacity: 0.7; }
    }

    #errorMsg {
      position: fixed;
      bottom: 110px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      background: rgba(0, 0, 0, 0.75);
      color: #f87171;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 0.9rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
      max-width: 90%;
      text-align: center;
    }

    #errorMsg.visible {
      opacity: 1;
    }
  </style>
</head>
<body>
  <video id="player" playsinline loop muted></video>

  <div id="listeningDot"></div>
  <div id="errorMsg"></div>

  <button id="btnToggle" title="Ativar / Desativar microfone">
    <svg class="mic-icon" viewBox="0 0 24 24">
      <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
      <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
    </svg>
  </button>

  <script>
    const TOTAL_VIDEOS = 40;
    const SPONSORS_FILE = 'patrocinadores.mp4';

    const numberWords = {
      'zero': 0, 'oi bit': 1, 'uma': 1, 'como você está': 2, 'oi': 2, 'três': 3, 'tres': 3,
      'quatro': 4, 'cinco': 5, 'seis': 6, 'sete': 7, 'oito': 8, 'nove': 9,
      'dez': 10, 'onze': 11, 'doze': 12, 'treze': 13, 'quatorze': 14, 'catorze': 14,
      'quinze': 15, 'dezesseis': 16, 'dezessete': 17, 'dezoito': 18, 'dezenove': 19,
      'vinte': 20, 'trinta': 30, 'quarenta': 40
    };

    const player = document.getElementById('player');
    const btnToggle = document.getElementById('btnToggle');
    const listeningDot = document.getElementById('listeningDot');
    const errorMsg = document.getElementById('errorMsg');

    let recognition = null;
    let isListening = false;
    let currentMode = 'idle';
    let restartTimeout = null;
    let errorTimeout = null;
    let hasUserInteracted = false;
    let micPermissionGranted = false;

    function showError(msg) {
      errorMsg.textContent = msg;
      errorMsg.classList.add('visible');
      clearTimeout(errorTimeout);
      errorTimeout = setTimeout(() => {
        errorMsg.classList.remove('visible');
      }, 4000);
    }

    function extractNumber(transcript) {
      const text = transcript.toLowerCase()
        .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
        .replace(/[^\w\s]/g, ' ')
        .replace(/\s+/g, ' ')
        .trim();

      const digitMatch = text.match(/\b([1-9]|[1-3][0-9]|40)\b/);
      if (digitMatch) {
        const num = parseInt(digitMatch[1], 10);
        if (num >= 1 && num <= TOTAL_VIDEOS) return num;
      }

      const compounds = [
        { re: /\bvinte\s+e\s+um\b/, n: 21 },
        { re: /\bvinte\s+e\s+dois\b/, n: 22 },
        { re: /\bvinte\s+e\s+tres\b/, n: 23 },
        { re: /\bvinte\s+e\s+quatro\b/, n: 24 },
        { re: /\bvinte\s+e\s+cinco\b/, n: 25 },
        { re: /\bvinte\s+e\s+seis\b/, n: 26 },
        { re: /\bvinte\s+e\s+sete\b/, n: 27 },
        { re: /\bvinte\s+e\s+oito\b/, n: 28 },
        { re: /\bvinte\s+e\s+nove\b/, n: 29 },
        { re: /\btrinta\s+e\s+um\b/, n: 31 },
        { re: /\btrinta\s+e\s+dois\b/, n: 32 },
        { re: /\btrinta\s+e\s+tres\b/, n: 33 },
        { re: /\btrinta\s+e\s+quatro\b/, n: 34 },
        { re: /\btrinta\s+e\s+cinco\b/, n: 35 },
        { re: /\btrinta\s+e\s+seis\b/, n: 36 },
        { re: /\btrinta\s+e\s+sete\b/, n: 37 },
        { re: /\btrinta\s+e\s+oito\b/, n: 38 },
        { re: /\btrinta\s+e\s+nove\b/, n: 39 }
      ];

      for (const c of compounds) {
        if (c.re.test(text)) return c.n;
      }

      const words = text.split(' ');
      for (const word of words) {
        if (numberWords[word] !== undefined) {
          const n = numberWords[word];
          if (n >= 1 && n <= TOTAL_VIDEOS) return n;
        }
      }

      return null;
    }

    function playVideo(number) {
      const src = `video${number}.mp4`;
      currentMode = 'video';
      player.loop = false;
      player.muted = !hasUserInteracted;
      player.src = src;
      player.load();

      const playPromise = player.play();
      if (playPromise !== undefined) {
        playPromise.catch(err => {
          console.error('Erro ao reproduzir vídeo:', err);
          if (!player.muted) {
            player.muted = true;
            player.play().catch(() => {
              showError(`Não foi possível carregar video${number}.mp4`);
              setTimeout(playSponsors, 1000);
            });
          } else {
            showError(`Não foi possível carregar video${number}.mp4`);
            setTimeout(playSponsors, 1000);
          }
        });
      }
    }

    function playSponsors() {
      currentMode = 'sponsors';
      player.loop = true;
      player.muted = !hasUserInteracted;
      player.src = SPONSORS_FILE;
      player.load();

      const playPromise = player.play();
      if (playPromise !== undefined) {
        playPromise.catch(err => {
          console.error('Erro ao reproduzir patrocinadores:', err);
          player.muted = true;
          player.play().catch(err2 => {
            console.error('Falha definitiva:', err2);
            showError('Não foi possível carregar patrocinadores.mp4. Verifique se o arquivo está na mesma pasta.');
          });
        });
      }
    }

    player.addEventListener('ended', () => {
      if (currentMode === 'video') {
        playSponsors();
      }
    });

    function enableSound() {
      if (!hasUserInteracted) {
        hasUserInteracted = true;
        player.muted = false;
      }
    }

    function initRecognition() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        showError('Navegador não suporta reconhecimento de voz. Use Chrome ou Edge.');
        return null;
      }

      const rec = new SpeechRecognition();
      rec.lang = 'pt-BR';
      rec.continuous = true;
      rec.interimResults = false;
      rec.maxAlternatives = 1;

      rec.onstart = () => {
        isListening = true;
        btnToggle.classList.add('active');
        listeningDot.classList.add('visible');
      };

      rec.onend = () => {
        isListening = false;
        listeningDot.classList.remove('visible');

        if (btnToggle.classList.contains('active')) {
          clearTimeout(restartTimeout);
          restartTimeout = setTimeout(() => {
            try {
              rec.start();
            } catch (e) {}
          }, 300);
        }
      };

      rec.onerror = (event) => {
        if (event.error === 'not-allowed') {
          showError('Permissão do microfone negada. Permita o acesso e recarregue a página.');
          btnToggle.classList.remove('active');
          listeningDot.classList.remove('visible');
          micPermissionGranted = false;
        } else if (event.error === 'no-speech') {
          // silencioso
        } else if (event.error !== 'aborted') {
          console.warn('Speech error:', event.error);
        }
      };

      rec.onresult = (event) => {
        const last = event.results[event.results.length - 1];
        if (!last.isFinal) return;

        const transcript = last[0].transcript.trim();
        const number = extractNumber(transcript);

        if (number !== null) {
          playVideo(number);
        }
      };

      return rec;
    }

    async function ensureMicPermission() {
      if (micPermissionGranted) {
        return true;
      }

      try {
        if (navigator.permissions && navigator.permissions.query) {
          const result = await navigator.permissions.query({ name: 'microphone' });
          if (result.state === 'granted') {
            micPermissionGranted = true;
            return true;
          }
          if (result.state === 'denied') {
            showError('Microfone bloqueado. Permita o acesso nas configurações do navegador e recarregue.');
            return false;
          }
        }
      } catch (e) {}

      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        stream.getTracks().forEach(track => track.stop());
        micPermissionGranted = true;
        return true;
      } catch (err) {
        console.warn('Mic permission error:', err);
        showError('Permissão do microfone necessária. Clique em Permitir quando o navegador pedir.');
        return false;
      }
    }

    btnToggle.addEventListener('click', async () => {
      enableSound();

      if (!recognition) {
        const ok = await ensureMicPermission();
        if (!ok) return;

        recognition = initRecognition();
        if (!recognition) return;
      }

      if (btnToggle.classList.contains('active')) {
        btnToggle.classList.remove('active');
        listeningDot.classList.remove('visible');
        try {
          recognition.stop();
        } catch (e) {}
      } else {
        try {
          recognition.start();
        } catch (e) {
          recognition = initRecognition();
          if (recognition) {
            try { recognition.start(); } catch (e2) {}
          }
        }
      }
    });

    document.addEventListener('click', enableSound);
    document.addEventListener('touchstart', enableSound);

    window.addEventListener('load', () => {
      playSponsors();
    });

    let fullscreenRequested = false;
    document.addEventListener('click', () => {
      if (!fullscreenRequested) {
        fullscreenRequested = true;
        const el = document.documentElement;
        if (el.requestFullscreen) {
          el.requestFullscreen().catch(() => {});
        } else if (el.webkitRequestFullscreen) {
          el.webkitRequestFullscreen();
        }
      }
    }, { once: true });
  </script>
</body>
</html>
