<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Gerenciador de Computadores — Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] }
        }
      }
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    * { -webkit-tap-highlight-color: transparent; }
    body { font-family: 'Inter', system-ui, sans-serif; }
    .toast { animation: slideIn 0.3s ease; }
    @keyframes slideIn {
      from { transform: translateY(100%); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    @media (min-width: 640px) {
      .toast { animation-name: slideInRight; }
      @keyframes slideInRight {
        from { transform: translateX(100%); opacity: 0; }
        to { transform: translateX(0); opacity: 1; }
      }
    }
    .status-ativo { background: #dcfce7; color: #166534; }
    .status-inativo { background: #fee2e2; color: #991b1b; }
    .status-manutencao { background: #fef3c7; color: #92400e; }
    .scroll-thin::-webkit-scrollbar { height: 4px; width: 4px; }
    .scroll-thin::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    .card-item { transition: background 0.15s; }
    .card-item:active { background: #f1f5f9; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen pb-20 sm:pb-6">

  <!-- Header -->
  <header class="bg-slate-900 text-white sticky top-0 z-40 shadow-lg">
    <div class="max-w-7xl mx-auto px-3 sm:px-4 py-3 sm:py-4">
      <div class="flex items-center justify-between gap-2">
        <div class="flex items-center gap-2.5 min-w-0">
          <div class="bg-blue-500 p-1.5 sm:p-2 rounded-lg shrink-0">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 sm:h-6 sm:w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
            </svg>
          </div>
          <div class="min-w-0">
            <h1 class="text-base sm:text-xl font-bold truncate">Gerenciador de PCs</h1>
            <p class="text-slate-400 text-[11px] sm:text-sm hidden sm:block">Preview localStorage</p>
          </div>
        </div>
        <div class="flex items-center gap-1.5 sm:gap-2 shrink-0">
          <span class="hidden sm:inline px-2.5 py-1 rounded-full bg-amber-500/20 text-amber-300 text-[11px] font-medium">localStorage</span>
          <button onclick="resetDemo()" class="px-2.5 py-1.5 bg-slate-700 hover:bg-slate-600 active:bg-slate-500 rounded-lg text-[11px] sm:text-xs font-medium transition">
            Resetar
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- Tabs -->
  <nav class="bg-white border-b border-slate-200 sticky top-[52px] sm:top-[68px] z-30 shadow-sm">
    <div class="max-w-7xl mx-auto px-2 sm:px-4">
      <div class="flex gap-1 overflow-x-auto scroll-thin py-2 -mx-1 px-1" style="scrollbar-width: none;">
        <button onclick="switchTab('computadores')" id="tab-computadores" class="tab-btn px-3 sm:px-4 py-2 rounded-lg text-xs sm:text-sm font-medium bg-blue-600 text-white whitespace-nowrap shrink-0">Computadores</button>
        <button onclick="switchTab('orgaos')" id="tab-orgaos" class="tab-btn px-3 sm:px-4 py-2 rounded-lg text-xs sm:text-sm font-medium text-slate-600 hover:bg-slate-100 whitespace-nowrap shrink-0">Órgãos</button>
        <button onclick="switchTab('departamentos')" id="tab-departamentos" class="tab-btn px-3 sm:px-4 py-2 rounded-lg text-xs sm:text-sm font-medium text-slate-600 hover:bg-slate-100 whitespace-nowrap shrink-0">Departamentos</button>
        <button onclick="switchTab('salas')" id="tab-salas" class="tab-btn px-3 sm:px-4 py-2 rounded-lg text-xs sm:text-sm font-medium text-slate-600 hover:bg-slate-100 whitespace-nowrap shrink-0">Salas</button>
        <button onclick="switchTab('responsaveis')" id="tab-responsaveis" class="tab-btn px-3 sm:px-4 py-2 rounded-lg text-xs sm:text-sm font-medium text-slate-600 hover:bg-slate-100 whitespace-nowrap shrink-0">Responsáveis</button>
      </div>
    </div>
  </nav>

  <main class="max-w-7xl mx-auto px-3 sm:px-4 py-4 sm:py-6">

    <!-- Stats -->
    <div id="stats-section" class="grid grid-cols-2 sm:grid-cols-4 gap-2 sm:gap-4 mb-4 sm:mb-6">
      <div class="bg-white rounded-xl p-3 sm:p-4 shadow-sm border border-slate-200">
        <p class="text-slate-500 text-[11px] sm:text-sm">Total</p>
        <p class="text-xl sm:text-2xl font-bold text-slate-800" id="stat-total">0</p>
      </div>
      <div class="bg-white rounded-xl p-3 sm:p-4 shadow-sm border border-slate-200">
        <p class="text-slate-500 text-[11px] sm:text-sm">Ativos</p>
        <p class="text-xl sm:text-2xl font-bold text-green-600" id="stat-ativos">0</p>
      </div>
      <div class="bg-white rounded-xl p-3 sm:p-4 shadow-sm border border-slate-200">
        <p class="text-slate-500 text-[11px] sm:text-sm">Inativos</p>
        <p class="text-xl sm:text-2xl font-bold text-red-600" id="stat-inativos">0</p>
      </div>
      <div class="bg-white rounded-xl p-3 sm:p-4 shadow-sm border border-slate-200">
        <p class="text-slate-500 text-[11px] sm:text-sm">Manutenção</p>
        <p class="text-xl sm:text-2xl font-bold text-amber-600" id="stat-manutencao">0</p>
      </div>
    </div>

    <!-- Toolbar -->
    <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-3 sm:p-4 mb-4 sm:mb-6">
      <div class="flex flex-col gap-2.5 sm:gap-3">
        <div class="relative">
          <input type="text" id="search-input" placeholder="Buscar..." class="w-full pl-9 pr-3 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none text-sm" oninput="handleSearch()" />
          <svg class="absolute left-3 top-3 h-4 w-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
        </div>
        <div class="flex flex-col sm:flex-row gap-2">
          <select id="filter-status" class="flex-1 border border-slate-300 rounded-lg px-3 py-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none" onchange="handleSearch()">
            <option value="">Todos os status</option>
            <option value="Ativo">Ativo</option>
            <option value="Inativo">Inativo</option>
            <option value="Em manutenção">Em manutenção</option>
          </select>
          <div class="flex gap-2">
            <button onclick="exportCSV()" id="btn-export" class="flex-1 sm:flex-none px-3 sm:px-4 py-2.5 bg-slate-100 hover:bg-slate-200 active:bg-slate-300 text-slate-700 rounded-lg text-sm font-medium transition flex items-center justify-center gap-1.5">
              <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
              <span>CSV</span>
            </button>
            <button onclick="openModal()" class="flex-1 sm:flex-none px-3 sm:px-4 py-2.5 bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white rounded-lg text-sm font-medium transition flex items-center justify-center gap-1.5">
              <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
              <span>Novo</span>
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Lista -->
    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
      <!-- Desktop: tabela -->
      <div class="hidden md:block overflow-x-auto">
        <table class="w-full text-sm">
          <thead class="bg-slate-50 border-b border-slate-200">
            <tr id="table-header"></tr>
          </thead>
          <tbody id="table-body" class="divide-y divide-slate-100"></tbody>
        </table>
      </div>

      <!-- Mobile: cards -->
      <div id="cards-body" class="md:hidden divide-y divide-slate-100"></div>

      <!-- Paginação -->
      <div class="px-3 sm:px-4 py-3 border-t border-slate-200 flex items-center justify-between text-xs sm:text-sm text-slate-500">
        <span id="pagination-info">0 registros</span>
        <div class="flex gap-2">
          <button onclick="changePage(-1)" id="btn-prev" class="px-3 py-1.5 rounded-lg border border-slate-300 hover:bg-slate-50 active:bg-slate-100 disabled:opacity-40 text-xs sm:text-sm" disabled>Anterior</button>
          <button onclick="changePage(1)" id="btn-next" class="px-3 py-1.5 rounded-lg border border-slate-300 hover:bg-slate-50 active:bg-slate-100 disabled:opacity-40 text-xs sm:text-sm" disabled>Próximo</button>
        </div>
      </div>
    </div>
  </main>

  <!-- FAB mobile -->
  <button onclick="openModal()" class="md:hidden fixed bottom-5 right-5 z-30 w-14 h-14 bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white rounded-full shadow-lg flex items-center justify-center transition">
    <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
  </button>

  <!-- Modal -->
  <div id="modal" class="fixed inset-0 z-50 hidden">
    <div class="absolute inset-0 bg-black/50" onclick="closeModal()"></div>
    <div class="absolute inset-0 flex items-end sm:items-center justify-center sm:p-4">
      <div class="bg-white rounded-t-2xl sm:rounded-2xl shadow-2xl w-full sm:max-w-lg max-h-[92vh] sm:max-h-[90vh] overflow-y-auto relative">
        <div class="sm:hidden flex justify-center pt-2 pb-1">
          <div class="w-10 h-1 bg-slate-300 rounded-full"></div>
        </div>
        <div class="sticky top-0 bg-white border-b border-slate-200 px-4 sm:px-6 py-3 sm:py-4 flex items-center justify-between sm:rounded-t-2xl z-10">
          <h2 id="modal-title" class="text-base sm:text-lg font-semibold">Novo</h2>
          <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 p-1.5 -mr-1.5 rounded-lg hover:bg-slate-100">
            <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
          </button>
        </div>
        <form id="modal-form" class="p-4 sm:p-6 space-y-3.5 sm:space-y-4" onsubmit="saveItem(event)">
          <div id="form-fields"></div>
          <div class="flex gap-2.5 sm:gap-3 pt-1 pb-2 sm:pb-0">
            <button type="button" onclick="closeModal()" class="flex-1 px-4 py-3 sm:py-2.5 border border-slate-300 rounded-xl sm:rounded-lg text-sm font-medium hover:bg-slate-50 active:bg-slate-100 transition">Cancelar</button>
            <button type="submit" class="flex-1 px-4 py-3 sm:py-2.5 bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white rounded-xl sm:rounded-lg text-sm font-medium transition">Salvar</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast-container" class="fixed bottom-20 sm:bottom-4 left-3 right-3 sm:left-auto sm:right-4 z-50 space-y-2 sm:max-w-sm"></div>

  <script>
    const DB_KEY = 'gerenciador_computadores_db_v2';

    const defaultData = {
      orgaos: [
        { id: 'o1', nome: 'Prefeitura Municipal', created_at: '2025-01-10T10:00:00Z' },
        { id: 'o2', nome: 'Secretaria de Educação', created_at: '2025-01-12T10:00:00Z' },
        { id: 'o3', nome: 'Secretaria de Saúde', created_at: '2025-02-01T10:00:00Z' }
      ],
      departamentos: [
        { id: 'd1', nome: 'Tecnologia da Informação', orgao_id: 'o1', created_at: '2025-01-15T10:00:00Z' },
        { id: 'd2', nome: 'Recursos Humanos', orgao_id: 'o1', created_at: '2025-01-16T10:00:00Z' },
        { id: 'd3', nome: 'Ensino Fundamental', orgao_id: 'o2', created_at: '2025-01-20T10:00:00Z' },
        { id: 'd4', nome: 'Atenção Básica', orgao_id: 'o3', created_at: '2025-02-05T10:00:00Z' }
      ],
      salas: [
        { id: 's1', nome: 'Sala TI-01', departamento_id: 'd1', created_at: '2025-01-18T10:00:00Z' },
        { id: 's2', nome: 'Sala TI-02', departamento_id: 'd1', created_at: '2025-01-18T11:00:00Z' },
        { id: 's3', nome: 'RH - Atendimento', departamento_id: 'd2', created_at: '2025-01-19T10:00:00Z' },
        { id: 's4', nome: 'Escola Municipal Centro', departamento_id: 'd3', created_at: '2025-01-22T10:00:00Z' },
        { id: 's5', nome: 'UBS Centro', departamento_id: 'd4', created_at: '2025-02-08T10:00:00Z' }
      ],
      responsaveis: [
        { id: 'r1', nome: 'João Silva', email: 'joao.silva@pref.gov.br', telefone: '(11) 99999-0001', created_at: '2025-01-10T10:00:00Z' },
        { id: 'r2', nome: 'Maria Santos', email: 'maria.santos@pref.gov.br', telefone: '(11) 99999-0002', created_at: '2025-01-11T10:00:00Z' },
        { id: 'r3', nome: 'Carlos Oliveira', email: 'carlos.oliveira@edu.gov.br', telefone: '(11) 99999-0003', created_at: '2025-01-12T10:00:00Z' },
        { id: 'r4', nome: 'Ana Costa', email: 'ana.costa@saude.gov.br', telefone: '(11) 99999-0004', created_at: '2025-02-02T10:00:00Z' }
      ],
      computadores: [
        { id: 'c1', nome: 'PC-TI-01', anydesk_id: '123 456 789', responsavel_id: 'r1', sala_id: 's1', status: 'Ativo', observacoes: 'Computador principal do suporte', created_at: '2025-01-20T10:00:00Z' },
        { id: 'c2', nome: 'PC-TI-02', anydesk_id: '987 654 321', responsavel_id: 'r1', sala_id: 's1', status: 'Ativo', observacoes: '', created_at: '2025-01-21T10:00:00Z' },
        { id: 'c3', nome: 'PC-TI-03', anydesk_id: '456 789 123', responsavel_id: 'r2', sala_id: 's2', status: 'Em manutenção', observacoes: 'Troca de HD em andamento', created_at: '2025-01-22T10:00:00Z' },
        { id: 'c4', nome: 'PC-RH-01', anydesk_id: '321 654 987', responsavel_id: 'r2', sala_id: 's3', status: 'Ativo', observacoes: '', created_at: '2025-01-23T10:00:00Z' },
        { id: 'c5', nome: 'PC-ESCOLA-01', anydesk_id: '111 222 333', responsavel_id: 'r3', sala_id: 's4', status: 'Ativo', observacoes: 'Laboratório de informática', created_at: '2025-01-25T10:00:00Z' },
        { id: 'c6', nome: 'PC-ESCOLA-02', anydesk_id: '444 555 666', responsavel_id: 'r3', sala_id: 's4', status: 'Inativo', observacoes: 'Aguardando descarte', created_at: '2025-01-26T10:00:00Z' },
        { id: 'c7', nome: 'PC-UBS-01', anydesk_id: '777 888 999', responsavel_id: 'r4', sala_id: 's5', status: 'Ativo', observacoes: 'Recepção da UBS', created_at: '2025-02-10T10:00:00Z' },
        { id: 'c8', nome: 'PC-UBS-02', anydesk_id: '000 111 222', responsavel_id: 'r4', sala_id: 's5', status: 'Em manutenção', observacoes: 'Problema na fonte', created_at: '2025-02-11T10:00:00Z' }
      ]
    };

    function loadDB() {
      const raw = localStorage.getItem(DB_KEY);
      if (!raw) {
        localStorage.setItem(DB_KEY, JSON.stringify(defaultData));
        return structuredClone(defaultData);
      }
      return JSON.parse(raw);
    }

    function saveDB(db) { localStorage.setItem(DB_KEY, JSON.stringify(db)); }
    function uid() { return 'id_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

    let db = loadDB();
    let currentTab = 'computadores';
    let currentPage = 0;
    const PAGE_SIZE = 12;
    let editingId = null;
    let filteredData = [];

    function getOrgao(id) { return db.orgaos.find(o => o.id === id); }
    function getDepartamento(id) { return db.departamentos.find(d => d.id === id); }
    function getSala(id) { return db.salas.find(s => s.id === id); }
    function getResponsavel(id) { return db.responsaveis.find(r => r.id === id); }

    function enrichComputador(c) {
      const sala = getSala(c.sala_id);
      const dep = sala ? getDepartamento(sala.departamento_id) : null;
      const org = dep ? getOrgao(dep.orgao_id) : null;
      const resp = getResponsavel(c.responsavel_id);
      return {
        ...c,
        salas: sala ? { nome: sala.nome, departamentos: dep ? { nome: dep.nome, orgaos: org ? { nome: org.nome } : null } : null } : null,
        responsaveis: resp ? { nome: resp.nome } : null
      };
    }

    function enrichDepartamento(d) {
      const org = getOrgao(d.orgao_id);
      return { ...d, orgaos: org ? { nome: org.nome } : null };
    }

    function enrichSala(s) {
      const dep = getDepartamento(s.departamento_id);
      const org = dep ? getOrgao(dep.orgao_id) : null;
      return { ...s, departamentos: dep ? { nome: dep.nome, orgaos: org ? { nome: org.nome } : null } : null };
    }

    document.addEventListener('DOMContentLoaded', () => loadData());

    function resetDemo() {
      if (!confirm('Apagar todos os dados e restaurar os exemplos?')) return;
      localStorage.removeItem(DB_KEY);
      db = loadDB();
      currentPage = 0;
      loadData();
      showToast('Dados restaurados!', 'success');
    }

    function switchTab(tab) {
      currentTab = tab;
      currentPage = 0;
      editingId = null;
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.className = 'tab-btn px-3 sm:px-4 py-2 rounded-lg text-xs sm:text-sm font-medium text-slate-600 hover:bg-slate-100 whitespace-nowrap shrink-0';
      });
      document.getElementById('tab-' + tab).className = 'tab-btn px-3 sm:px-4 py-2 rounded-lg text-xs sm:text-sm font-medium bg-blue-600 text-white whitespace-nowrap shrink-0';

      const isComp = tab === 'computadores';
      document.getElementById('stats-section').classList.toggle('hidden', !isComp);
      document.getElementById('filter-status').classList.toggle('hidden', !isComp);
      document.getElementById('btn-export').classList.toggle('hidden', !isComp);

      document.getElementById('search-input').value = '';
      loadData();
    }

    function getRawData() {
      switch (currentTab) {
        case 'orgaos': return [...db.orgaos];
        case 'departamentos': return db.departamentos.map(enrichDepartamento);
        case 'salas': return db.salas.map(enrichSala);
        case 'responsaveis': return [...db.responsaveis];
        case 'computadores': return db.computadores.map(enrichComputador);
      }
    }

    function loadData() {
      const data = getRawData();
      filteredData = data;
      if (currentTab === 'computadores') updateStats(data);
      handleSearch();
    }

    function updateStats(data) {
      document.getElementById('stat-total').textContent = data.length;
      document.getElementById('stat-ativos').textContent = data.filter(c => c.status === 'Ativo').length;
      document.getElementById('stat-inativos').textContent = data.filter(c => c.status === 'Inativo').length;
      document.getElementById('stat-manutencao').textContent = data.filter(c => c.status === 'Em manutenção').length;
    }

    function renderTable() {
      const headers = {
        orgaos: ['Nome', 'Criado em', 'Ações'],
        departamentos: ['Nome', 'Órgão', 'Criado em', 'Ações'],
        salas: ['Nome', 'Departamento', 'Órgão', 'Criado em', 'Ações'],
        responsaveis: ['Nome', 'E-mail', 'Telefone', 'Criado em', 'Ações'],
        computadores: ['Nome', 'AnyDesk', 'Responsável', 'Sala', 'Departamento', 'Órgão', 'Status', 'Ações']
      };

      document.getElementById('table-header').innerHTML = headers[currentTab]
        .map(h => `<th class="px-4 py-3 text-left text-xs font-semibold text-slate-500 uppercase tracking-wider">${h}</th>`)
        .join('');

      const start = currentPage * PAGE_SIZE;
      const pageData = filteredData.slice(start, start + PAGE_SIZE);

      const tbody = document.getElementById('table-body');
      if (pageData.length === 0) {
        tbody.innerHTML = '<tr><td colspan="10" class="text-center py-12 text-slate-400">Nenhum registro encontrado</td></tr>';
      } else {
        tbody.innerHTML = pageData.map(item => renderRow(item)).join('');
      }

      const cards = document.getElementById('cards-body');
      if (pageData.length === 0) {
        cards.innerHTML = '<div class="text-center py-12 text-slate-400 text-sm">Nenhum registro encontrado</div>';
      } else {
        cards.innerHTML = pageData.map(item => renderCard(item)).join('');
      }

      document.getElementById('pagination-info').textContent = `${filteredData.length} registro(s)`;
      document.getElementById('btn-prev').disabled = currentPage === 0;
      document.getElementById('btn-next').disabled = start + PAGE_SIZE >= filteredData.length;
    }

    function renderRow(item) {
      const date = item.created_at ? new Date(item.created_at).toLocaleDateString('pt-BR') : '-';
      const actions = `<td class="px-4 py-3"><div class="flex gap-2">
        <button onclick="editItem('${item.id}')" class="text-blue-600 hover:text-blue-800 text-xs font-medium">Editar</button>
        <button onclick="deleteItem('${item.id}')" class="text-red-600 hover:text-red-800 text-xs font-medium">Excluir</button>
      </div></td>`;

      switch (currentTab) {
        case 'orgaos':
          return `<tr class="hover:bg-slate-50"><td class="px-4 py-3 font-medium">${esc(item.nome)}</td><td class="px-4 py-3 text-slate-500">${date}</td>${actions}</tr>`;
        case 'departamentos':
          return `<tr class="hover:bg-slate-50"><td class="px-4 py-3 font-medium">${esc(item.nome)}</td><td class="px-4 py-3">${esc(item.orgaos?.nome || '-')}</td><td class="px-4 py-3 text-slate-500">${date}</td>${actions}</tr>`;
        case 'salas':
          return `<tr class="hover:bg-slate-50"><td class="px-4 py-3 font-medium">${esc(item.nome)}</td><td class="px-4 py-3">${esc(item.departamentos?.nome || '-')}</td><td class="px-4 py-3">${esc(item.departamentos?.orgaos?.nome || '-')}</td><td class="px-4 py-3 text-slate-500">${date}</td>${actions}</tr>`;
        case 'responsaveis':
          return `<tr class="hover:bg-slate-50"><td class="px-4 py-3 font-medium">${esc(item.nome)}</td><td class="px-4 py-3">${esc(item.email || '-')}</td><td class="px-4 py-3">${esc(item.telefone || '-')}</td><td class="px-4 py-3 text-slate-500">${date}</td>${actions}</tr>`;
        case 'computadores':
          const sc = item.status === 'Ativo' ? 'status-ativo' : item.status === 'Inativo' ? 'status-inativo' : 'status-manutencao';
          return `<tr class="hover:bg-slate-50">
            <td class="px-4 py-3 font-medium">${esc(item.nome)}</td>
            <td class="px-4 py-3"><div class="flex items-center gap-2">
              <code class="bg-slate-100 px-2 py-0.5 rounded text-xs">${esc(item.anydesk_id || '-')}</code>
              ${item.anydesk_id ? `<button onclick="copyAnydesk('${esc(item.anydesk_id)}')" class="text-slate-400 hover:text-blue-600"><svg class="h-3.5 w-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg></button>` : ''}
            </div></td>
            <td class="px-4 py-3">${esc(item.responsaveis?.nome || '-')}</td>
            <td class="px-4 py-3">${esc(item.salas?.nome || '-')}</td>
            <td class="px-4 py-3">${esc(item.salas?.departamentos?.nome || '-')}</td>
            <td class="px-4 py-3">${esc(item.salas?.departamentos?.orgaos?.nome || '-')}</td>
            <td class="px-4 py-3"><span class="px-2 py-1 rounded-full text-xs font-medium ${sc}">${esc(item.status)}</span></td>
            ${actions}</tr>`;
      }
    }

    function renderCard(item) {
      const date = item.created_at ? new Date(item.created_at).toLocaleDateString('pt-BR') : '-';
      const actions = `
        <div class="flex gap-2 mt-3 pt-3 border-t border-slate-100">
          <button onclick="editItem('${item.id}')" class="flex-1 py-2 text-blue-600 bg-blue-50 hover:bg-blue-100 active:bg-blue-200 rounded-lg text-xs font-medium transition">Editar</button>
          <button onclick="deleteItem('${item.id}')" class="flex-1 py-2 text-red-600 bg-red-50 hover:bg-red-100 active:bg-red-200 rounded-lg text-xs font-medium transition">Excluir</button>
        </div>`;

      switch (currentTab) {
        case 'orgaos':
          return `<div class="card-item p-4">
            <p class="font-semibold text-sm">${esc(item.nome)}</p>
            <p class="text-xs text-slate-400 mt-1">Criado em ${date}</p>
            ${actions}</div>`;
        case 'departamentos':
          return `<div class="card-item p-4">
            <p class="font-semibold text-sm">${esc(item.nome)}</p>
            <p class="text-xs text-slate-500 mt-1">${esc(item.orgaos?.nome || '-')}</p>
            <p class="text-xs text-slate-400 mt-0.5">Criado em ${date}</p>
            ${actions}</div>`;
        case 'salas':
          return `<div class="card-item p-4">
            <p class="font-semibold text-sm">${esc(item.nome)}</p>
            <p class="text-xs text-slate-500 mt-1">${esc(item.departamentos?.nome || '-')} · ${esc(item.departamentos?.orgaos?.nome || '-')}</p>
            <p class="text-xs text-slate-400 mt-0.5">Criado em ${date}</p>
            ${actions}</div>`;
        case 'responsaveis':
          return `<div class="card-item p-4">
            <p class="font-semibold text-sm">${esc(item.nome)}</p>
            <p class="text-xs text-slate-500 mt-1">${esc(item.email || 'Sem e-mail')}</p>
            <p class="text-xs text-slate-500">${esc(item.telefone || 'Sem telefone')}</p>
            ${actions}</div>`;
        case 'computadores':
          const sc = item.status === 'Ativo' ? 'status-ativo' : item.status === 'Inativo' ? 'status-inativo' : 'status-manutencao';
          return `<div class="card-item p-4">
            <div class="flex items-start justify-between gap-2">
              <div class="min-w-0">
                <p class="font-semibold text-sm truncate">${esc(item.nome)}</p>
                <p class="text-xs text-slate-500 mt-0.5 truncate">${esc(item.responsaveis?.nome || 'Sem responsável')}</p>
              </div>
              <span class="px-2 py-0.5 rounded-full text-[10px] font-medium ${sc} shrink-0">${esc(item.status)}</span>
            </div>
            <div class="flex items-center gap-2 mt-2">
              <code class="bg-slate-100 px-2 py-0.5 rounded text-xs">${esc(item.anydesk_id || '-')}</code>
              ${item.anydesk_id ? `<button onclick="copyAnydesk('${esc(item.anydesk_id)}')" class="text-blue-600 text-xs font-medium">Copiar</button>` : ''}
            </div>
            <p class="text-xs text-slate-400 mt-1.5 truncate">${esc(item.salas?.nome || '-')} · ${esc(item.salas?.departamentos?.nome || '-')} · ${esc(item.salas?.departamentos?.orgaos?.nome || '-')}</p>
            ${actions}</div>`;
      }
    }

    function esc(str) {
      if (!str) return '';
      return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function handleSearch() {
      const term = document.getElementById('search-input').value.toLowerCase().trim();
      const statusFilter = document.getElementById('filter-status').value;
      currentPage = 0;
      const data = getRawData();
      filteredData = data.filter(item => {
        let match = true;
        if (term) match = JSON.stringify(item).toLowerCase().includes(term);
        if (match && statusFilter && currentTab === 'computadores') match = item.status === statusFilter;
        return match;
      });
      renderTable();
    }

    function changePage(dir) {
      currentPage += dir;
      renderTable();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function openModal(id = null) {
      editingId = id;
      document.getElementById('modal-title').textContent = id ? 'Editar' : 'Novo';
      document.getElementById('form-fields').innerHTML = getFormFields();
      document.getElementById('modal').classList.remove('hidden');
      document.body.style.overflow = 'hidden';
      if (id) {
        const item = db[currentTab].find(d => d.id === id);
        if (item) fillForm(item);
      }
    }

    function closeModal() {
      document.getElementById('modal').classList.add('hidden');
      document.body.style.overflow = '';
      editingId = null;
    }

    function getFormFields() {
      const inputCls = 'w-full px-3 py-2.5 border border-slate-300 rounded-xl sm:rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none';
      const labelCls = 'block text-sm font-medium text-slate-700 mb-1';

      switch (currentTab) {
        case 'orgaos':
          return `<div><label class="${labelCls}">Nome do Órgão *</label><input name="nome" required class="${inputCls}" /></div>`;
        case 'departamentos':
          return `<div><label class="${labelCls}">Nome do Departamento *</label><input name="nome" required class="${inputCls}" /></div>
          <div><label class="${labelCls}">Órgão *</label>
            <select name="orgao_id" required class="${inputCls}"><option value="">Selecione...</option>
            ${db.orgaos.map(o => `<option value="${o.id}">${esc(o.nome)}</option>`).join('')}</select></div>`;
        case 'salas':
          return `<div><label class="${labelCls}">Nome da Sala *</label><input name="nome" required class="${inputCls}" /></div>
          <div><label class="${labelCls}">Departamento *</label>
            <select name="departamento_id" required class="${inputCls}"><option value="">Selecione...</option>
            ${db.departamentos.map(d => { const org = getOrgao(d.orgao_id); return `<option value="${d.id}">${esc(d.nome)} (${esc(org?.nome || '')})</option>`; }).join('')}
            </select></div>`;
        case 'responsaveis':
          return `<div><label class="${labelCls}">Nome *</label><input name="nome" required class="${inputCls}" /></div>
          <div><label class="${labelCls}">E-mail</label><input name="email" type="email" class="${inputCls}" /></div>
          <div><label class="${labelCls}">Telefone</label><input name="telefone" class="${inputCls}" /></div>`;
        case 'computadores':
          return `<div><label class="${labelCls}">Nome / Identificação *</label><input name="nome" required class="${inputCls}" placeholder="Ex: PC-Recepção-01" /></div>
          <div><label class="${labelCls}">ID AnyDesk *</label><input name="anydesk_id" required class="${inputCls}" placeholder="Ex: 123 456 789" /></div>
          <div><label class="${labelCls}">Responsável</label>
            <select name="responsavel_id" class="${inputCls}"><option value="">Nenhum</option>
            ${db.responsaveis.map(r => `<option value="${r.id}">${esc(r.nome)}</option>`).join('')}</select></div>
          <div><label class="${labelCls}">Sala *</label>
            <select name="sala_id" required class="${inputCls}"><option value="">Selecione...</option>
            ${db.salas.map(s => { const dep = getDepartamento(s.departamento_id); const org = dep ? getOrgao(dep.orgao_id) : null;
              return `<option value="${s.id}">${esc(s.nome)} — ${esc(dep?.nome || '')} / ${esc(org?.nome || '')}</option>`; }).join('')}
            </select></div>
          <div><label class="${labelCls}">Status *</label>
            <select name="status" required class="${inputCls}">
              <option value="Ativo">Ativo</option><option value="Inativo">Inativo</option><option value="Em manutenção">Em manutenção</option>
            </select></div>
          <div><label class="${labelCls}">Observações</label><textarea name="observacoes" rows="2" class="${inputCls}"></textarea></div>`;
      }
    }

    function fillForm(item) {
      const form = document.getElementById('modal-form');
      Object.keys(item).forEach(key => {
        const el = form.elements[key];
        if (el) el.value = item[key] ?? '';
      });
    }

    function saveItem(e) {
      e.preventDefault();
      const formData = new FormData(e.target);
      const data = Object.fromEntries(formData.entries());
      ['orgao_id', 'departamento_id', 'sala_id', 'responsavel_id'].forEach(k => { if (data[k] === '') data[k] = null; });

      if (editingId) {
        const idx = db[currentTab].findIndex(d => d.id === editingId);
        if (idx !== -1) db[currentTab][idx] = { ...db[currentTab][idx], ...data };
        showToast('Atualizado com sucesso!', 'success');
      } else {
        db[currentTab].push({ id: uid(), ...data, created_at: new Date().toISOString() });
        showToast('Cadastrado com sucesso!', 'success');
      }
      saveDB(db);
      closeModal();
      loadData();
    }

    function editItem(id) { openModal(id); }

    function deleteItem(id) {
      if (!confirm('Tem certeza que deseja excluir?')) return;
      if (currentTab === 'orgaos' && db.departamentos.some(d => d.orgao_id === id)) {
        showToast('Existem departamentos vinculados.', 'error'); return;
      }
      if (currentTab === 'departamentos' && db.salas.some(s => s.departamento_id === id)) {
        showToast('Existem salas vinculadas.', 'error'); return;
      }
      if (currentTab === 'salas' && db.computadores.some(c => c.sala_id === id)) {
        showToast('Existem computadores vinculados.', 'error'); return;
      }
      if (currentTab === 'responsaveis' && db.computadores.some(c => c.responsavel_id === id)) {
        showToast('Existem computadores vinculados.', 'error'); return;
      }
      db[currentTab] = db[currentTab].filter(d => d.id !== id);
      saveDB(db);
      showToast('Excluído com sucesso!', 'success');
      loadData();
    }

    function copyAnydesk(id) {
      navigator.clipboard.writeText(id).then(() => showToast('AnyDesk copiado!', 'success'));
    }

    function exportCSV() {
      if (currentTab !== 'computadores' || filteredData.length === 0) {
        showToast('Nenhum dado para exportar', 'error'); return;
      }
      const headers = ['Nome', 'AnyDesk', 'Responsável', 'Sala', 'Departamento', 'Órgão', 'Status', 'Observações'];
      const rows = filteredData.map(c => [
        c.nome, c.anydesk_id, c.responsaveis?.nome || '', c.salas?.nome || '',
        c.salas?.departamentos?.nome || '', c.salas?.departamentos?.orgaos?.nome || '',
        c.status, c.observacoes || ''
      ]);
      const csv = [headers, ...rows].map(r => r.map(v => `"${(v||'').replace(/"/g,'""')}"`).join(',')).join('\n');
      const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = 'computadores.csv';
      link.click();
      showToast('CSV exportado!', 'success');
    }

    function showToast(msg, type = 'success') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      const bg = type === 'success' ? 'bg-green-600' : 'bg-red-600';
      toast.className = `toast ${bg} text-white px-4 py-3 rounded-xl shadow-lg text-sm font-medium flex items-center gap-2`;
      toast.innerHTML = `<span>${type === 'success' ? '✓' : '✕'}</span><span>${msg}</span>`;
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transition = 'opacity 0.3s';
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }
  </script>
</body>
</html>
