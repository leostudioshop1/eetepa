<!DOCTYPE html>
<html lang="pt-BR" class="h-full bg-slate-950 text-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão Financeira</title>

    <!-- Configurações do Supabase -->
    <script src="config.js"></script>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            500: '#6366f1',
                            600: '#4f46e5',
                        }
                    }
                }
            }
        }
    </script>

    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        @media print {
            body { background: white !important; color: black !important; }
            .no-print { display: none !important; }
            .card-print { border: 1px solid #ddd !important; box-shadow: none !important; }
        }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #020617; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 3px; }
    </style>
</head>
<body class="min-h-full flex flex-col font-sans antialiased text-slate-200 bg-slate-950">

    <!-- BARRA SUPERIOR -->
    <header class="bg-slate-900/60 backdrop-blur border-b border-slate-800/80 sticky top-0 z-30 no-print">
        <div class="max-w-5xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-2.5">
                <div class="w-8 h-8 rounded-lg bg-indigo-500/10 border border-indigo-500/20 flex items-center justify-center text-indigo-400">
                    <i class="fa-solid fa-wallet text-sm"></i>
                </div>
                <span class="font-bold text-sm tracking-tight text-white">Minhas Finanças</span>
            </div>

            <div class="flex items-center space-x-2 text-xs">
                <!-- Status Supabase / Local -->
                <div id="supabaseStatusBadge" class="px-2.5 py-1 rounded-full bg-slate-800 text-slate-400 border border-slate-700/50 flex items-center gap-1.5 font-medium">
                    <span id="supabaseStatusDot" class="w-1.5 h-1.5 rounded-full bg-amber-400"></span>
                    <span id="supabaseStatusText" class="hidden sm:inline">Local</span>
                </div>

                <button onclick="exportCSV()" title="Exportar para CSV/Excel" class="p-1.5 px-2.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 transition border border-slate-700/50">
                    <i class="fa-solid fa-file-csv mr-1"></i> <span class="hidden sm:inline">Exportar</span>
                </button>
                <button onclick="window.print()" title="Imprimir Relatório" class="p-1.5 px-2.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white font-medium transition">
                    <i class="fa-solid fa-print"></i>
                </button>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-5xl w-full mx-auto px-4 py-6 space-y-6">

        <!-- RESUMO RÁPIDO (CARDS CLEAN) -->
        <div class="grid grid-cols-3 gap-3 sm:gap-4">
            <div class="bg-slate-900/80 border border-slate-800 p-3 sm:p-4 rounded-xl card-print">
                <span class="text-[11px] font-medium text-slate-400 block mb-0.5">Entradas</span>
                <span id="cardIncome" class="text-base sm:text-xl font-bold text-emerald-400">R$ 0,00</span>
            </div>
            <div class="bg-slate-900/80 border border-slate-800 p-3 sm:p-4 rounded-xl card-print">
                <span class="text-[11px] font-medium text-slate-400 block mb-0.5">Saídas</span>
                <span id="cardExpense" class="text-base sm:text-xl font-bold text-rose-400">R$ 0,00</span>
            </div>
            <div class="bg-slate-900/80 border border-slate-800 p-3 sm:p-4 rounded-xl card-print">
                <span class="text-[11px] font-medium text-slate-400 block mb-0.5">Saldo</span>
                <span id="cardBalance" class="text-base sm:text-xl font-bold text-slate-100">R$ 0,00</span>
            </div>
        </div>

        <!-- FORMULÁRIO DE INSERÇÃO DIRETA -->
        <div class="bg-slate-900/90 border border-slate-800 rounded-2xl p-4 sm:p-5 shadow-2xl no-print">
            <div class="flex items-center justify-between mb-3">
                <div class="flex items-center space-x-2">
                    <span class="text-xs font-semibold uppercase tracking-wider text-slate-400" id="formTitle">Novo Lançamento</span>
                </div>

                <!-- Alternador de Tipo Direto (Saída vs Entrada) -->
                <div class="inline-flex p-0.5 bg-slate-950 border border-slate-800 rounded-lg">
                    <button type="button" id="btnTypeExpense" onclick="setTransactionType('expense')" class="px-3 py-1 text-xs font-semibold rounded-md bg-rose-500/20 text-rose-400 transition">
                        <i class="fa-solid fa-arrow-up mr-1"></i> Saída
                    </button>
                    <button type="button" id="btnTypeIncome" onclick="setTransactionType('income')" class="px-3 py-1 text-xs font-semibold rounded-md text-slate-400 hover:text-slate-200 transition">
                        <i class="fa-solid fa-arrow-down mr-1"></i> Entrada
                    </button>
                </div>
            </div>

            <form id="transactionForm" onsubmit="handleFormSubmit(event)" class="space-y-3">
                <input type="hidden" id="editId">
                <input type="hidden" id="transactionType" value="expense">

                <!-- Campo de Valor em Destaque -->
                <div class="relative">
                    <span class="absolute left-3.5 top-2.5 text-slate-500 font-semibold text-lg">R$</span>
                    <input type="number" step="0.01" min="0.01" id="amount" required placeholder="0,00" class="w-full bg-slate-950 border border-slate-800 rounded-xl pl-11 pr-4 py-2.5 text-xl font-bold text-white focus:outline-none focus:border-indigo-500 transition">
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-3 gap-2.5">
                    <!-- Descrição -->
                    <div class="sm:col-span-1">
                        <input type="text" id="description" placeholder="Descrição (ex: Almoço, Uber...)" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2 text-xs text-slate-100 focus:outline-none focus:border-indigo-500">
                    </div>

                    <!-- Categoria -->
                    <div>
                        <select id="category" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2 text-xs text-slate-100 focus:outline-none focus:border-indigo-500">
                            <!-- Preenchido via JS -->
                        </select>
                    </div>

                    <!-- Data -->
                    <div>
                        <input type="date" id="date" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2 text-xs text-slate-100 focus:outline-none focus:border-indigo-500">
                    </div>
                </div>

                <!-- Botões de Ação -->
                <div class="flex items-center gap-2 pt-1">
                    <button type="submit" id="submitBtn" class="flex-1 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-2.5 rounded-xl transition text-xs flex items-center justify-center gap-2">
                        <i class="fa-solid fa-check"></i>
                        <span id="submitBtnText">Salvar Despesa</span>
                    </button>
                    <button type="button" id="cancelEditBtn" onclick="resetForm()" class="hidden bg-slate-800 hover:bg-slate-700 text-slate-300 font-medium px-4 py-2.5 rounded-xl text-xs">
                        Cancelar
                    </button>
                </div>
            </form>
        </div>

        <!-- FILTRO DE PERÍODO & LISTA -->
        <div class="space-y-4">
            <div class="flex flex-wrap justify-between items-center gap-2 no-print">
                <div class="flex items-center space-x-2">
                    <span class="text-xs font-bold text-slate-300">Histórico de Lançamentos</span>
                </div>

                <div class="flex items-center gap-2">
                    <select id="periodSelect" onchange="renderApp()" class="bg-slate-900 border border-slate-800 text-slate-300 text-xs rounded-lg px-2.5 py-1.5 focus:outline-none">
                        <option value="current_month">Mês Atual</option>
                        <option value="last_month">Mês Anterior</option>
                        <option value="current_year">Ano Atual</option>
                        <option value="all">Tudo</option>
                    </select>

                    <input type="text" id="searchQuery" oninput="renderTable()" placeholder="Buscar..." class="bg-slate-900 border border-slate-800 text-slate-300 text-xs rounded-lg px-2.5 py-1.5 focus:outline-none w-28 sm:w-36">
                </div>
            </div>

            <!-- TABELA RESPONSIVA / LISTA CLEAN -->
            <div class="bg-slate-900/80 border border-slate-800 rounded-xl overflow-hidden card-print">
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-xs text-slate-300">
                        <thead class="bg-slate-950/60 uppercase text-[10px] tracking-wider text-slate-500 border-b border-slate-800">
                            <tr>
                                <th class="p-3">Data</th>
                                <th class="p-3">Descrição</th>
                                <th class="p-3">Categoria</th>
                                <th class="p-3 text-right">Valor</th>
                                <th class="p-3 text-center no-print">Ações</th>
                            </tr>
                        </thead>
                        <tbody id="transactionTableBody" class="divide-y divide-slate-800/60">
                            <!-- Inserido dinamicamente pelo JS -->
                        </tbody>
                    </table>
                </div>

                <div id="emptyState" class="hidden py-8 text-center text-slate-500 text-xs">
                    Nenhum lançamento encontrado para o período.
                </div>
            </div>
        </div>

        <!-- RELATÓRIOS E GRÁFICOS (COMPACTOS) -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="bg-slate-900/80 border border-slate-800 rounded-xl p-4 card-print">
                <h3 class="text-xs font-semibold text-slate-400 mb-3">Fluxo de Caixa</h3>
                <div class="relative h-48 w-full">
                    <canvas id="cashFlowChart"></canvas>
                </div>
            </div>

            <div class="bg-slate-900/80 border border-slate-800 rounded-xl p-4 card-print">
                <h3 class="text-xs font-semibold text-slate-400 mb-3">Gastos por Categoria</h3>
                <div class="relative h-48 w-full flex items-center justify-center">
                    <canvas id="categoryChart"></canvas>
                </div>
            </div>
        </div>

    </main>

    <!-- JS APLICAÇÃO -->
    <script>
        const CATEGORIES = {
            expense: ['Alimentação', 'Moradia', 'Transporte', 'Saúde', 'Lazer', 'Contas', 'Outros'],
            income: ['Salário', 'Freelance', 'Investimentos', 'Outros']
        };

        let transactions = [];
        let supabaseClient = null;
        let isSupabaseActive = false;
        let cashFlowChartInstance = null;
        let categoryChartInstance = null;

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('date').value = new Date().toISOString().split('T')[0];
            updateCategoryOptions();
            initSupabaseFromConfig();
            loadTransactions();
        });

        function setTransactionType(type) {
            document.getElementById('transactionType').value = type;
            const btnExpense = document.getElementById('btnTypeExpense');
            const btnIncome = document.getElementById('btnTypeIncome');
            const submitBtnText = document.getElementById('submitBtnText');

            if (type === 'expense') {
                btnExpense.className = "px-3 py-1 text-xs font-semibold rounded-md bg-rose-500/20 text-rose-400 transition";
                btnIncome.className = "px-3 py-1 text-xs font-semibold rounded-md text-slate-400 hover:text-slate-200 transition";
                submitBtnText.innerText = "Salvar Despesa";
            } else {
                btnIncome.className = "px-3 py-1 text-xs font-semibold rounded-md bg-emerald-500/20 text-emerald-400 transition";
                btnExpense.className = "px-3 py-1 text-xs font-semibold rounded-md text-slate-400 hover:text-slate-200 transition";
                submitBtnText.innerText = "Salvar Receita";
            }

            updateCategoryOptions();
        }

        function initSupabaseFromConfig() {
            const url = window.SUPABASE_URL || (typeof SUPABASE_URL !== 'undefined' ? SUPABASE_URL : null);
            const key = window.SUPABASE_ANON_KEY || (typeof SUPABASE_ANON_KEY !== 'undefined' ? SUPABASE_ANON_KEY : null);

            if (url && key) {
                try {
                    supabaseClient = supabase.createClient(url, key);
                    isSupabaseActive = true;
                    updateStatusBadge(true, 'Supabase On');
                } catch (err) {
                    updateStatusBadge(false, 'Local (Erro Supabase)');
                }
            } else {
                updateStatusBadge(false, 'Local');
            }
        }

        function updateStatusBadge(active, text) {
            document.getElementById('supabaseStatusText').innerText = text;
            const dot = document.getElementById('supabaseStatusDot');
            dot.className = active ? "w-1.5 h-1.5 rounded-full bg-emerald-400" : "w-1.5 h-1.5 rounded-full bg-amber-400";
        }

        function updateCategoryOptions() {
            const type = document.getElementById('transactionType').value;
            const categorySelect = document.getElementById('category');
            categorySelect.innerHTML = '';

            CATEGORIES[type].forEach(cat => {
                const opt = document.createElement('option');
                opt.value = cat;
                opt.textContent = cat;
                categorySelect.appendChild(opt);
            });
        }

        async function loadTransactions() {
            if (isSupabaseActive) {
                try {
                    const { data, error } = await supabaseClient.from('transactions').select('*').order('date', { ascending: false });
                    if (error) throw error;
                    transactions = data || [];
                } catch (err) {
                    transactions = getLocalTransactions();
                }
            } else {
                transactions = getLocalTransactions();
            }

            renderApp();
        }

        function getLocalTransactions() {
            return JSON.parse(localStorage.getItem('finances_data') || '[]');
        }

        function saveLocalTransactions(data) {
            localStorage.setItem('finances_data', JSON.stringify(data));
        }

        async function handleFormSubmit(e) {
            e.preventDefault();

            const editId = document.getElementById('editId').value;
            const type = document.getElementById('transactionType').value;
            const amount = parseFloat(document.getElementById('amount').value);
            const date = document.getElementById('date').value;
            const category = document.getElementById('category').value;
            const description = document.getElementById('description').value.trim();

            const payload = { type, amount, date, category, description, updated_at: new Date().toISOString() };

            if (isSupabaseActive) {
                try {
                    if (editId) {
                        await supabaseClient.from('transactions').update(payload).eq('id', editId);
                    } else {
                        await supabaseClient.from('transactions').insert([payload]);
                    }
                } catch (err) {
                    alert('Erro ao salvar: ' + err.message);
                    return;
                }
            } else {
                if (editId) {
                    const idx = transactions.findIndex(t => t.id == editId);
                    if (idx !== -1) transactions[idx] = { ...transactions[idx], ...payload };
                } else {
                    payload.id = Date.now().toString();
                    transactions.unshift(payload);
                }
                saveLocalTransactions(transactions);
            }

            resetForm();
            await loadTransactions();
        }

        function resetForm() {
            document.getElementById('transactionForm').reset();
            document.getElementById('editId').value = '';
            document.getElementById('date').value = new Date().toISOString().split('T')[0];
            setTransactionType('expense');

            document.getElementById('formTitle').innerText = 'Novo Lançamento';
            document.getElementById('cancelEditBtn').classList.add('hidden');
        }

        function editTransaction(id) {
            const item = transactions.find(t => t.id == id);
            if (!item) return;

            document.getElementById('editId').value = item.id;
            setTransactionType(item.type);

            document.getElementById('amount').value = item.amount;
            document.getElementById('date').value = item.date;
            document.getElementById('category').value = item.category;
            document.getElementById('description').value = item.description;

            document.getElementById('formTitle').innerText = 'Editar Lançamento';
            document.getElementById('cancelEditBtn').classList.remove('hidden');

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        async function deleteTransaction(id) {
            if (!confirm('Excluir este lançamento?')) return;

            if (isSupabaseActive) {
                await supabaseClient.from('transactions').delete().eq('id', id);
            } else {
                transactions = transactions.filter(t => t.id != id);
                saveLocalTransactions(transactions);
            }

            await loadTransactions();
        }

        function getFilteredTransactions() {
            const period = document.getElementById('periodSelect').value;
            const now = new Date();

            return transactions.filter(t => {
                const tDate = new Date(t.date + 'T00:00:00');
                if (period === 'current_month') {
                    return tDate.getMonth() === now.getMonth() && tDate.getFullYear() === now.getFullYear();
                } else if (period === 'last_month') {
                    const lastMonth = new Date(now.getFullYear(), now.getMonth() - 1, 1);
                    return tDate.getMonth() === lastMonth.getMonth() && tDate.getFullYear() === lastMonth.getFullYear();
                } else if (period === 'current_year') {
                    return tDate.getFullYear() === now.getFullYear();
                }
                return true;
            });
        }

        function renderApp() {
            const filtered = getFilteredTransactions();
            renderCards(filtered);
            renderTable(filtered);
            renderCharts(filtered);
        }

        function renderCards(data) {
            const income = data.filter(t => t.type === 'income').reduce((acc, t) => acc + Number(t.amount), 0);
            const expense = data.filter(t => t.type === 'expense').reduce((acc, t) => acc + Number(t.amount), 0);
            const balance = income - expense;

            document.getElementById('cardIncome').innerText = formatCurrency(income);
            document.getElementById('cardExpense').innerText = formatCurrency(expense);
            
            const cardBalance = document.getElementById('cardBalance');
            cardBalance.innerText = formatCurrency(balance);
            cardBalance.className = `text-base sm:text-xl font-bold ${balance >= 0 ? 'text-emerald-400' : 'text-rose-400'}`;
        }

        function renderTable(dataToUse) {
            const data = dataToUse || getFilteredTransactions();
            const query = document.getElementById('searchQuery').value.toLowerCase();

            const tbody = document.getElementById('transactionTableBody');
            tbody.innerHTML = '';

            const finalData = data.filter(t => 
                t.description.toLowerCase().includes(query) || t.category.toLowerCase().includes(query)
            );

            if (finalData.length === 0) {
                document.getElementById('emptyState').classList.remove('hidden');
                return;
            } else {
                document.getElementById('emptyState').classList.add('hidden');
            }

            finalData.forEach(t => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-800/40 transition";

                const isExpense = t.type === 'expense';

                tr.innerHTML = `
                    <td class="p-3 text-slate-400 whitespace-nowrap">${formatDate(t.date)}</td>
                    <td class="p-3 font-medium text-slate-200">${escapeHTML(t.description)}</td>
                    <td class="p-3 text-slate-400">${escapeHTML(t.category)}</td>
                    <td class="p-3 text-right font-semibold whitespace-nowrap ${isExpense ? 'text-rose-400' : 'text-emerald-400'}">
                        ${isExpense ? '-' : '+'} ${formatCurrency(t.amount)}
                    </td>
                    <td class="p-3 text-center no-print whitespace-nowrap">
                        <button onclick="editTransaction('${t.id}')" class="text-slate-500 hover:text-indigo-400 p-1 mr-1">
                            <i class="fa-solid fa-pen"></i>
                        </button>
                        <button onclick="deleteTransaction('${t.id}')" class="text-slate-500 hover:text-rose-400 p-1">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function renderCharts(data) {
            // Chart 1: Fluxo
            const monthsMap = {};
            data.forEach(t => {
                const monthKey = t.date.substring(0, 7);
                if (!monthsMap[monthKey]) monthsMap[monthKey] = { income: 0, expense: 0 };
                if (t.type === 'income') monthsMap[monthKey].income += Number(t.amount);
                else monthsMap[monthKey].expense += Number(t.amount);
            });

            const sortedMonths = Object.keys(monthsMap).sort();
            const labels = sortedMonths.map(m => m.split('-')[1]);

            if (cashFlowChartInstance) cashFlowChartInstance.destroy();
            const ctx1 = document.getElementById('cashFlowChart').getContext('2d');
            cashFlowChartInstance = new Chart(ctx1, {
                type: 'bar',
                data: {
                    labels: labels.length ? labels : ['-'],
                    datasets: [
                        { label: 'Entradas', data: sortedMonths.map(m => monthsMap[m].income), backgroundColor: '#10b981' },
                        { label: 'Saídas', data: sortedMonths.map(m => monthsMap[m].expense), backgroundColor: '#f43f5e' }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { labels: { color: '#64748b', font: { size: 10 } } } },
                    scales: {
                        x: { ticks: { color: '#64748b' }, grid: { display: false } },
                        y: { ticks: { color: '#64748b' }, grid: { color: '#1e293b' } }
                    }
                }
            });

            // Chart 2: Categorias
            const categoryMap = {};
            data.filter(t => t.type === 'expense').forEach(t => {
                categoryMap[t.category] = (categoryMap[t.category] || 0) + Number(t.amount);
            });

            if (categoryChartInstance) categoryChartInstance.destroy();
            const ctx2 = document.getElementById('categoryChart').getContext('2d');
            categoryChartInstance = new Chart(ctx2, {
                type: 'doughnut',
                data: {
                    labels: Object.keys(categoryMap),
                    datasets: [{
                        data: Object.values(categoryMap),
                        backgroundColor: ['#f43f5e', '#6366f1', '#eab308', '#a855f7', '#06b6d4', '#f97316', '#64748b'],
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { position: 'bottom', labels: { color: '#64748b', font: { size: 10 } } } }
                }
            });
        }

        function exportCSV() {
            if (transactions.length === 0) return alert('Sem dados.');
            let csv = "data:text/csv;charset=utf-8,ID,Tipo,Data,Categoria,Descricao,Valor\n";
            transactions.forEach(t => {
                csv += `"${t.id}","${t.type}","${t.date}","${t.category}","${t.description.replace(/"/g, '""')}",${t.amount}\n`;
            });
            const link = document.createElement("a");
            link.setAttribute("href", encodeURI(csv));
            link.setAttribute("download", `financas_${new Date().toISOString().split('T')[0]}.csv`);
            document.body.appendChild(link);
            link.click();
            link.remove();
        }

        function formatCurrency(val) {
            return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(val || 0);
        }

        function formatDate(dateStr) {
            if (!dateStr) return '';
            const [year, month, day] = dateStr.split('-');
            return `${day}/${month}/${year.substring(2)}`;
        }

        function escapeHTML(str) {
            return String(str).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m]));
        }
    </script>
</body>
</html>
